when we try to keep unity? (Awit 133:1, 2 Cor. 13:11) Encourage student to focus on others' good qualities, not weaknesses, and see that keeping peace makes Jehovah happy.",tl_main:"Sinasabi sa parapo na ang pagkilala kay Jehova ay tumutulong sa estudyante na pahalagahan ang pagkakaisa. Itanong: Ano ang nararamdaman ni Jehova kapag sinisikap nating ingatan ang pagkakaisa? (Awit 133:1, 2 Cor. 13:11) Hikayatin ang estudyante na magpokus sa magagandang katangian ng iba imbes na kahinaan, at makita na napapasaya niya si Jehova kapag pinangangalagaan ang kapayapaan.",en_add1:"It teaches that love for Jehovah helps overcome interpersonal difficulties. Unity pleases Jehovah.",tl_add1:"Itinuturo nito na ang pag-ibig kay Jehova ay nakakatulong na malampasan ang problema sa pakikisama. Ang pagkakaisa ay nakalulugod kay Jehova.",en_add2:"I will help my student think: 'How does Jehovah feel when I keep peace?' and encourage him to look for good in brothers.",tl_add2:"Tuturuan ko ang estudyante na mag-isip: 'Ano ang nararamdaman ni Jehova kapag pinangangalagaan ko ang kapayapaan?' at hikayating hanapin ang maganda sa mga kapatid.",en_quick:"Unity pleases Jehovah - Ps. 133:1, 2 Cor. 13:11 - focus on good qualities.",tl_quick:"Ang pagkakaisa ay nakalulugod kay Jehova - Awit 133:1, 2 Cor. 13:11 - magpokus sa maganda."},{n:"15-16",q:"(a) When a Bible student needs to make an important decision, how can he imitate Jesus? (John 8:29) (b) How did Marianne help her Bible student make a good decision? (See also picture.)",tl_q:"(a) Kapag kailangang gumawa ng malaking desisyon ng bina-Bible study natin, paano niya matutularan si Jesus? (Juan 8:29) (b) Paano tinulungan ni Marianne ang bina-Bible study niya na makagawa ng tamang desisyon? (Tingnan din ang larawan.)",en_main:"Par. 15 says help student use what he knows about Jehovah to decide. Suggest lesson 35 'How to Make Good Decisions' in Enjoy Life Forever!. If he prayed and researched but still struggles because many principles, tell him to think about Jesus. Jesus said: 'I always do what pleases [my Father].' (John 8:29) So ask: 'Based on research and what you learned about Jehovah, what decision will make Him happy?' Good decision is one that pleases Jehovah. Par. 16: Marianne in Chile had student pressured to take high-paying job affecting meetings. Marianne said: 'Think what Jehovah will feel. Will it make Him happy? Mention specifically in prayer and see how Jehovah answers.' Student refused job and found one not affecting meetings. Marianne didn't tell her what to do; she helped her reason using what she knew about Jehovah. Student became closer to Jehovah. Marianne said: 'She learned if we put Jehovah first, He will not abandon us.'",tl_main:"Sinasabi sa parapo 15 na matutulungan ang estudyante na gamitin ang alam tungkol kay Jehova sa pagdedesisyon. Sabihin na tingnan ang aralin 35 'Kung Paano Makakagawa ng Tamang Desisyon.' Kung nanalangin at nag-research pero nahihirapan pa, sabihin na pag-isipan si Jesus. Sinabi ni Jesus: 'Lagi kong ginagawa ang gusto ng aking Ama.' (Juan 8:29) Kaya itanong: 'Base sa research at natutuhan tungkol kay Jehova, anong desisyon ang magpapasaya sa kaniya?' Magandang desisyon ang nakalulugod kay Jehova. Sa parapo 16: Si Marianne sa Chile, ang study niya pinipilit tanggapin ang trabahong malaki suweldo pero makakaapekto sa pulong. Sabi ni Marianne: 'Isipin kung ano mararamdaman ni Jehova. Mapapasaya ba ito? Espesipikong banggitin sa panalangin at tingnan kung paano sasagutin ni Jehova.' Tumanggi ang study at nakahanap ng trabahong hindi nakakaapekto sa pulong. Hindi sinabi ni Marianne kung ano gagawin; tinulungan siyang mag-isip gamit ang alam tungkol kay Jehova. Naging mas malapit siya kay Jehova. Sabi ni Marianne: 'Natutuhan niya na kung uunahin si Jehova, hindi Niya tayo pababayaan.'",en_add1:"It teaches Jesus' simple decision rule John 8:29 pleases Father, and Marianne shows not deciding for student but helping him use knowledge of Jehovah builds his own friendship with Jehovah.",tl_add1:"Itinuturo nito ang simpleng tuntunin ni Jesus Juan 8:29 na palugdan ang Ama, at ipinakita ni Marianne na hindi magdesisyon para sa estudyante kundi tulungan siyang gamitin ang kaalaman tungkol kay Jehova para lumago ang sarili niyang pakikipagkaibigan kay Jehova.",en_add2:"I will imitate Jesus and Marianne: not tell student what to do, but ask 'What do you know about Jehovah that helps decide? What will make Jehovah happy?' and encourage specific prayer.",tl_add2:"Tutularan ko si Jesus at si Marianne: hindi sasabihin kung ano gagawin, kundi magtatanong 'Ano alam mo tungkol kay Jehova na makakatulong magdesisyon? Ano magpapasaya kay Jehova?' at hikayating banggitin sa panalangin.",en_quick:"Imitate Jesus John 8:29 - what pleases Father? Marianne helped student reason, not decide for her.",tl_quick:"Tularan si Jesus Juan 8:29 - ano nakalulugod sa Ama? Tinulungan ni Marianne na mag-isip, hindi nagdesisyon para sa kaniya."},{n:"17",q:"Besides learning information, what else do we want for our Bible students?",tl_q:"Bukod sa matuto ng impormasyon, ano pa ang gusto natin para sa mga inaaralan natin sa Bibliya?",en_main:"The paragraph says besides just learning information, we want our Bible students to develop a deep love for Jehovah and to use their knowledge. We want them to put knowledge to work—apply it in decisions, show it in conduct, and reflect Jehovah's qualities like Joseph and Jesus did. The goal is not just to know about Jehovah but to know Him as a friend.",tl_main:"Sinasabi sa parapo na bukod sa matuto ng impormasyon, gusto natin na magkaroon ng malalim na pag-ibig sa Jehova ang mga inaaralan at gamitin ang kaalaman. Gusto nating gamitin nila ang kaalaman—gamitin sa mga desisyon, ipakita sa paggawi, at ipakita ang mga katangian ni Jehova tulad nina Jose at Jesus. Ang layunin ay hindi lang malaman ang tungkol kay Jehova kundi makilala Siya bilang kaibigan.",en_add1:"It teaches that our teaching aims at transformation of heart, not just passing a Bible test. Information without love and application is incomplete. A student who loves Jehovah will want to use what he learns.",tl_add1:"Itinuturo nito na ang pagtuturo natin ay naglalayong baguhin ang puso, hindi lang makapasa sa Bible test. Ang impormasyon na walang pag-ibig at paggamit ay hindi kumpleto. Ang estudyanteng nagmamahal kay Jehova ay gugustuhing gamitin ang natutuhan.",en_add2:"I will check not just if my student knows the answer, but if he loves Jehovah and is trying to live what he learns—like Joseph who showed his knowledge by his actions.",tl_add2:"Susuriin ko hindi lang kung alam ng estudyante ang sagot, kundi kung mahal niya si Jehova at sinusubukang isabuhay ang natutuhan—tulad ni Jose na ipinakita ang kaalaman sa kilos.",en_quick:"Want students to love Jehovah and put knowledge to work, not just learn facts.",tl_quick:"Gusto natin na ibigin ng estudyante si Jehova at gamitin ang kaalaman, hindi lang matuto."},{n:"18",q:"What blessings will we receive when we come to know Jehovah well?",tl_q:"Anong mga pagpapala ang matatanggap natin kapag nakilala nating mabuti si Jehova?",en_main:"The paragraph says Psalm 25:14 says 'Close friendship with Jehovah belongs to those who fear Him.' When we truly know Jehovah well, we enjoy His friendship now—peace, guidance, joy—and in the future we will keep learning about Him forever. 1 John 5:20 and 1 Cor. 3 show that knowing Jehovah leads to eternal life and everlasting blessings.",tl_main:"Sinasabi sa parapo na Awit 25:14 ay 'Ang malapít na pakikipagkaibigan kay Jehova ay para sa mga natatakot sa Kaniya.' Kapag talagang nakilala nating mabuti si Jehova, tinatamasa natin ang pakikipagkaibigan Niya ngayon—kapayapaan, patnubay, kagalakan—at sa hinaharap ay patuloy tayong matututo tungkol sa Kaniya magpakailanman. Ipinapakita ng 1 Juan 5:20 at 1 Cor. 3 na ang pagkilala kay Jehova ay humahantong sa buhay na walang hanggan at walang hanggang pagpapala.",en_add1:"It teaches that the greatest blessing of knowing Jehovah is friendship with Him now and forever. This friendship gives us joy even in trials and hope for the future where we will never stop learning about Him.",tl_add1:"Itinuturo nito na ang pinakadakilang pagpapala ng pagkilala kay Jehova ay pakikipagkaibigan sa Kaniya ngayon at magpakailanman. Ang pakikipagkaibigang ito ay nagbibigay ng kagalakan kahit sa pagsubok at pag-asa sa hinaharap na hindi tayo titigil sa pagkatuto tungkol sa Kaniya.",en_add2:"I will keep helping others know Jehovah, knowing that each person who comes to know Him gains an eternal blessing, and I myself will never run out of things to learn about Jehovah forever.",tl_add2:"Patuloy kong tutulungan ang iba na makilala si Jehova, alam na bawat taong nakakakilala sa Kaniya ay nagtatamo ng walang hanggang pagpapala, at ako mismo ay hindi mauubusan ng matututuhan tungkol kay Jehova magpakailanman.",en_quick:"Blessing: close friendship with Jehovah now and learning forever - Ps. 25:14.",tl_quick:"Pagpapala: malapit na kaibigan ni Jehova ngayon at matututo magpakailanman - Awit 25:14."}],cong:[{n:"For Discussion",q:"In what ways did Moses show courage during this time of his life?",tl_q:"Sa anong mga paraan nagpakita ng lakas ng loob si Moises sa panahong ito ng buhay niya?",en_main:"Moses showed outstanding courage at 40. Raised as prince of Egypt, he refused to be called son of Pharaoh's daughter, defended Hebrew brother at great risk, even killing Egyptian to save him, and left Egypt for Midian trusting Jehovah.",tl_main:"Nagpakita ng natatanging lakas ng loob si Moises nang 40 anyos. Kahit prinsipe ng Ehipto, tumanggi siyang tawaging anak ng anak ni Paraon, ipinagtanggol ang kapatid na Hebreo kahit mapanganib, pinatay ang Egipcio, at umalis ng Ehipto papuntang Midian na nagtitiwala kay Jehova.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"1",q:"What historical evidence is consistent with the Bible's account that the Israelites were slaves in Egypt? (g03 5/8 2)",tl_q:"Anong mga ebidensiya sa kasaysayan ang kaayon ng ulat ng Bibliya na naging alipin ang mga Israelita sa Ehipto? (g03 5/8 2)",en_main:"Archaeology found slave lists with Semitic names like Brooklyn Papyrus with names Menahem, Asher. Pithom identified, bricks with straw found, consistent with Exodus 1:11-14.",tl_main:"Natuklasan ang listahan ng alipin na may Semitikong pangalan tulad ng Brooklyn Papyrus na may Menahem, Aser. Natukoy ang Pitom, laryong may dayami, kaayon ng Exodo 1:11-14.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"2",q:"How might Moses have been taught by his parents and then instructed in the wisdom of the Egyptians? (Acts 7:22; w02 6/15 10 ¶3)",tl_q:"Paano kaya naturuan si Moises ng mga magulang niya at pagkatapos ay tinuruan sa karunungan ng mga Egipcio? (Gawa 7:22; w02 6/15 10 ¶3)",en_main:"Jochebed had Moses ~3 years, planted faith that he was Hebrew and Jehovah promised deliverance. Acts 7:22 says he was instructed in all wisdom of Egyptians, powerful in words and deeds, skills Jehovah later used.",tl_main:"Nasa piling ni Jocebed si Moises ~3 taon, itinanim ang pananampalataya na isa siyang Hebreo at nangako si Jehova na magliligtas. Gawa 7:22 tinuruan sa karunungan ng Egipcio, makapangyarihan sa salita at gawa, kasanayang ginamit ni Jehova.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"3",q:"How did the Egyptians usually bury their dead? How might they have felt when Moses not only killed an Egyptian but also hid the body instead of embalming and burying it? (1st Pharaoh, Pilate 1:28) Picture B",tl_q:"Paano karaniwang inililibing ng mga Egipcio ang mga patay nila? Ano kaya ang posibleng naramdaman nila nang patayin ni Moises ang isang Egipcio at itago na lang ang bangkay sa halip na i-embalsamo at ilibing? (1st Pharaoh, Pilate 1:28) Larawan B",en_main:"Egyptians highly respected burial with embalming for afterlife. Hiding body in sand without embalming was deeply disrespectful, seen as double crime, making Pharaoh more angry. Exodus 2:12.",tl_main:"Iginagalang ng Egipcio ang paglilibing na may embalsamo para sa kabilang buhay. Pagtatago sa buhangin nang walang embalsamo ay kawalang-galang, dobleng krimen, lalong nagpagalit kay Paraon. Exodo 2:12.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"4",q:"Moses fled to Midian. What distress and discouragement must he have felt? (lff lesson 12 “More About Moses” and it-2 381 ¶7)",tl_q:"Tumakas si Moises papuntang Midian. Anong pighati at panghihina ng loob kaya ang naramdaman niya? (lff aralin 12 “Higit Pa Tungkol kay Moises” at it-2 381 ¶7)",en_main:"From prince to fugitive, rejected by his own saying 'Who appointed you prince?', alone in 300km desert to Midian, but Jehovah led him to Jethro's family. Teaches Jehovah sees motives.",tl_main:"Mula prinsipe naging pugante, tinanggihan ng sariling bayan na nagsabing 'Sino nagtalaga sa iyo?', nag-iisa sa 300km disyerto papuntang Midian, pero dinala ni Jehova sa pamilya ni Jetro. Nagtuturo na nakikita ni Jehova ang motibo.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"5",q:"What can parents learn from Amram and Jochebed?",tl_q:"Ano ang matututunan ng mga magulang kina Amram at Jochebed?",en_main:"Amram and Jochebed used short time to build faith. Hebrews 11:23 by faith they hid him. Parents today should make most of early years with family worship.",tl_main:"Maikling panahon lang pero ginamit nina Amram at Jocebed para magtayo ng pananampalataya. Hebreo 11:23 sa pananampalataya itinago siya. Dapat sulitin ng magulang ang maagang taon sa family worship.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"6",q:"What can young ones learn from Moses' decision? Picture C",tl_q:"Ano ang matututunan ng mga kabataan sa naging desisyon ni Moises? Larawan C",en_main:"Moses could have comfort, fame, wealth but chose suffering with God's people. Heb 11:26 reproach of Christ as greater riches. Young ones can choose Jehovah over popularity.",tl_main:"Puwede magkaroon ng kaginhawahan, kasikatan, yaman pero pinili magdusa kasama bayan ng Diyos. Heb 11:26 kadustaan ni Kristo mas malaking kayamanan. Magagawa rin ng kabataan na piliin si Jehova kaysa popularidad.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"7",q:"How can you imitate the courage shown by Moses in this account?",tl_q:"Paano mo matutularan ang lakas ng loob na ipinakita ni Moises sa ulat na ito?",en_main:"Imitate by taking stand for right despite risk, defending fellow Christian, refusing wrongdoing, leaving compromising situation, praying for courage.",tl_main:"Matutularan sa paninindigan para sa tama kahit mapanganib, pagtatanggol sa kapatid, pagtanggi sa maling gawain, pag-iwan sa nakokompromisong sitwasyon, panalangin para sa lakas ng loob.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"8",q:"What does this account teach you about Jehovah?",tl_q:"Ano ang itinuturo ng ulat na ito tungkol kay Jehova?",en_main:"Jehovah sees courage, patiently trains, provides refuge as with Jethro family, looks at heart and potential.",tl_main:"Nakikita ni Jehova ang lakas ng loob, matiising sinasanay, nagbibigay ng kanlungan gaya sa pamilya ni Jetro, tumitingin sa puso at potensiyal.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"9",q:"How does this account fit in with Jehovah's purpose?",tl_q:"Ano ang koneksiyon ng ulat na ito sa layunin ni Jehova?",en_main:"Jehovah's purpose to free Israel needed prepared leader. Egypt gave knowledge, Midian gave humility and wilderness knowledge to fulfill promise to Abraham.",tl_main:"Layunin ni Jehova na palayain Israel nangailangan ng handang lider. Ehipto nagbigay ng kaalaman, Midian nagbigay ng kapakumbabaan at kaalaman sa ilang para matupad pangako kay Abraham.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."},{n:"10",q:"If you could ask Moses about his early life, what would you ask him?",tl_q:"Kung matatanong mo si Moises tungkol sa maagang buhay niya, ano ang itatanong mo sa kaniya?",en_main:"How did your mother teach you about Jehovah in palace, how keep faith surrounded by Egyptian worship, how felt fleeing, how Jehovah comforted in Midian.",tl_main:"Paano ka tinuruan ng nanay mo tungkol kay Jehova sa palasyo, paano mo pinanatili pananampalataya na napapalibutan ng pagsambang Egipcio, ano naramdaman nang tumakas, paano ka inaliw ni Jehova sa Midian.",en_add1:"Additional insight: Jehovah supports courageous ones and uses training for future service.",tl_add1:"Karagdagang kaunawaan: Sinusuportahan ni Jehova ang matatapang at ginagamit ang pagsasanay para sa paglilingkod.",en_add2:"Application: Trust Jehovah when feeling discouraged or unqualified.",tl_add2:"Aplikasyon: Magtiwala kay Jehova kapag pinanghihinaan ng loob o pakiramdam na hindi kuwalipikado.",en_quick:"Moses chose faith over Egypt and Jehovah guided him.",tl_quick:"Pinili ni Moises ang pananampalataya kaysa sa Ehipto at ginabayan siya ni Jehova."}],gems:[{q:"Jer 39:6, 7—What bad choice did King Zedekiah make, and what can family heads learn from his example? (jr 92 ¶1)",tl_q:"Jer 39:6, 7—Anong maling desisyon ang ginawa ni Haring Zedekias, at ano ang matututuhan dito ng mga ulo ng pamilya? (jr 92 ¶1)",a:`Zedekiah's bad choice was to disobey Jehovah. Jehovah through Jeremiah told him to surrender to Babylon and live, but Zedekiah feared the princes and being mocked. He refused and tried to escape by night through the king's garden.

He was captured near Jericho. In Riblah, his sons were slaughtered before his eyes, then he was blinded and bound with copper fetters to Babylon. His wrong decision cost his sons' lives. Family heads learn: decisions based on fear of man bring tragedy to the whole family. (jr 92 ¶1)`,tl_a:`Maling desisyon ni Zedekias ang pagsuway kay Jehova. Sinabi ni Jehova sa pamamagitan ni Jeremias na sumuko sa Babilonya at mabubuhay, pero natakot si Zedekias sa mga prinsipe at sa pangungutya. Tumanggi siya at tumakas sa gabi sa hardin ng hari.

Nahuli siya malapit sa Jerico. Sa Ribla, pinatay ang mga anak niya sa harap niya, binulag siya at ginapos na tanso papuntang Babilonya. Ang maling desisyon niya ay ikinamatay ng mga anak niya. Matututuhan ng mga ulo ng pamilya: Ang desisyong base sa takot sa tao ay magdudulot ng trahedya sa buong pamilya. (jr 92 ¶1)`,c:"Lesson: Courage to obey Jehovah protects family; fear of man destroys it. w04 3/15 p.10.",tl_c:"Aral: Ang tapang na sumunod kay Jehova ang nagpoprotekta sa pamilya; ang takot sa tao ang sumisira nito. w04 3/15 p.10.",s:"Zedekiah disobeyed out of fear, sons killed before his eyes, blinded — family suffered for his bad choice.",tl_s:"Sinuway ni Zedekias dahil sa takot, pinatay mga anak sa harap niya, binulag — nagdusa pamilya dahil sa maling desisyon."},{q:"What spiritual gems from this week's Bible reading would you like to share?",tl_q:"Sa pagbabasa ng Bibliya para sa linggong ito, anong espirituwal na hiyas ang nagustuhan mo?",a:`Jer 38:6 — Jeremiah thrown into cistern of Malchiah with no water, only mire.
Gem: Faithful servants may end in miry, lonely situations.
Application today: When we feel stuck in a 'mire' — depression, job loss, family opposition — remember Jehovah can lift us out just as He lifted Jeremiah. Don't isolate; ask for help like Jeremiah accepted help.

Jer 38:7-13 — Ebed-melech, Ethiopian eunuch, courageously appealed to king with 30 men and used rags under Jeremiah's armpits to avoid injury.
Gem: Stand up for Jehovah's servants even when unpopular, and help thoughtfully.
Application: If a brother is being gossiped or bullied, have courage like Ebed-melech to speak up. When helping elderly or sick, be thoughtful — not just quick help, but comfortable and dignified help.

Jer 38:20 — 'Obey Jehovah and it will go well with you.'
Gem: Obedience always leads to blessing.
Application: Zedekiah knew right but feared man. Today, we may know we should attend meetings, avoid bad association, but fear what family or workmates say. Obey Jehovah anyway — it will go well long-term.

Jer 38:21,22 — Jeremiah warned Zedekiah's women would mock him if he didn't obey.
Gem: Bad association leads to humiliation.
Application: If we choose friends who don't love Jehovah, they may later mock our faith or get us into trouble. Choose friends who will support our obedience.

Jer 38:24-26 — Zedekiah told Jeremiah to keep conversation secret for safety.
Gem: Be discreet with confidential matters.
Application: When elders or family share confidential matters, we keep them secret. Don't share private congregation matters on social media. Be trustworthy.

Jer 38:27,28 — Jeremiah told princes only what king commanded, not everything.
Gem: Wisdom to be cautious as serpents, innocent as doves.
Application: At work or school when asked about our faith, we can answer truthfully but wisely — not revealing more than needed that could cause unnecessary trouble.

Jer 39:4 — Zedekiah and warriors fled by night to escape judgment.
Gem: Trying to escape Jehovah's judgment fails.
Application: We can't escape consequences by running. Better to face issues Jehovah's way — repent, obey — than try to hide problems.

Jer 39:11,12 — Nebuchadnezzar ordered: 'Take him and keep your eyes on him; do no harm.'
Gem: Jehovah can use even unbelievers to protect His servants.
Application: Today Jehovah can use a non-Witness boss, teacher, or government official to protect us. Trust that Jehovah's eyes are watching, even in a 'destroyed city' situation.

Jer 39:15-18 — Jehovah told Ebed-melech: 'I will save you because you trusted in me.'
Gem: Jehovah remembers courageous kindness.
Application: Jehovah doesn't forget when we show kindness to His servants. If we help pioneers, elderly, or those persecuted, Jehovah will remember and reward.

Jer 38:6,11 — The cistern belonged to Malchiah the king's son; rags came from wardrobe.
Gem: Jehovah provides what we need from unexpected sources.
Application: Help may come from unexpected places — a child, a new publisher, or someone we least expect. Be open to Jehovah's provisions.`,tl_a:`Jer 38:6 — Inihagis si Jeremias sa balon ni Malquias na walang tubig kundi putik.
Hiyas: Ang tapat ay maaaring mapunta sa maputik na sitwasyon.
Aplikasyon ngayon: Kapag pakiramdam natin ay stuck tayo sa 'putik' — depresyon, nawalan ng trabaho, tinututulan ng pamilya — alalahanin na iaahon tayo ni Jehova gaya ni Jeremias. Huwag magkulong; humingi ng tulong.

Jer 38:7-13 — Si Ebed-melec, Etiope, matapang na nakiusap sa hari kasama 30 lalaki at gumamit ng basahan sa kilikili ni Jeremias para hindi masaktan.
Hiyas: Tumayo para sa lingkod ni Jehova kahit di-popular, at tumulong nang maalalahanin.
Aplikasyon: Kung may kapatid na tsinitsismis o binu-bully, lakasan ang loob gaya ni Ebed-melec na ipagtanggol siya. Kapag tumutulong sa matatanda o may sakit, maging maalalahanin — hindi lang mabilis, kundi komportable at may dignidad.

Jer 38:20 — 'Sundin mo si Jehova at mapapabuti ka.'
Hiyas: Ang pagsunod ay laging humahantong sa pagpapala.
Aplikasyon: Alam ni Zedekias ang tama pero natakot sa tao. Ngayon, baka alam nating dapat dumalo sa pulong, umiwas sa masamang kasama, pero natatakot sa sasabihin ng pamilya o katrabaho. Sundin pa rin si Jehova — mapapabuti sa bandang huli.

Jer 38:21,22 — Binalaan ni Jeremias na kukutyain si Zedekias ng mga babae niya kung hindi susunod.
Hiyas: Ang masamang kasama ay humahantong sa kahihiyan.
Aplikasyon: Kung pipili tayo ng kaibigang hindi nagmamahal kay Jehova, baka kutyain nila ang pananampalataya natin. Pumili ng kaibigang susuporta sa pagsunod.

Jer 38:24-26 — Sinabi ni Zedekias kay Jeremias na ilihim ang usapan para sa kaligtasan.
Hiyas: Maging maingat sa confidential na bagay.
Aplikasyon: Kapag may ibinahaging confidential ang matatanda o pamilya, ilihim natin. Huwag i-post ang pribadong bagay ng kongregasyon sa social media. Maging mapagkakatiwalaan.

Jer 38:27,28 — Sinabi lang ni Jeremias sa mga prinsipe ang iniutos ng hari, hindi lahat.
Hiyas: Karunungan na maging maingat gaya ng ahas, maamo gaya ng kalapati.
Aplikasyon: Sa trabaho o eskuwelahan kapag tinanong tungkol sa pananampalataya, sumagot nang tapat pero matalino — huwag magbigay ng sobra na magdudulot ng hindi kailangang gulo.

Jer 39:4 — Tumakas si Zedekias at mga mandirigma sa gabi para takasan ang hatol.
Hiyas: Ang pagtakas sa hatol ni Jehova ay hindi magtatagumpay.
Aplikasyon: Hindi natin matatakasan ang resulta sa pagtakbo. Mas mabuti harapin sa paraan ni Jehova — magsisi, sumunod.

Jer 39:11,12 — Nag-utos si Nabucodonosor: 'Kunin siya at bantayan; huwag saktan.'
Hiyas: Magagamit ni Jehova kahit di-mananampalataya para protektahan tayo.
Aplikasyon: Magagamit ni Jehova ang boss, guro, o opisyal na di-Saksi para protektahan tayo. Magtiwala na nakatingin ang mga mata ni Jehova, kahit sa 'wasak na lunsod' na sitwasyon.

Jer 39:15-18 — Sinabi ni Jehova kay Ebed-melec: 'Ililigtas kita dahil nagtiwala ka sa akin.'
Hiyas: Naalala ni Jehova ang matapang na kabaitan.
Aplikasyon: Hindi nakakalimot si Jehova kapag nagpakita tayo ng kabaitan sa mga lingkod Niya. Kung tumulong tayo sa payunir, matatanda, o inuusig, aalalahanin at gagantimpalaan ni Jehova.

Jer 38:6,11 — Ang balon ay kay Malquias na anak ng hari; basahan mula sa wardrobe.
Hiyas: Naglalaan si Jehova mula sa di-inaasahang pinagmulan.
Aplikasyon: Ang tulong ay maaaring manggaling sa di-inaasahan — bata, bagong publisher, o taong hindi natin inaasahan. Maging bukas sa paglalaan ni Jehova.`,c:"10 gems for Jeremiah 38-39 — courage, obedience, discretion, Jehovah's protection and memory of kindness. Each 1-2 sentences so others can comment.",tl_c:"10 hiyas para sa Jeremias 38-39 — tapang, pagsunod, pagiging maingat, proteksyon ni Jehova at pag-alala sa kabaitan. Tig 1-2 pangungusap para may ibang makapagkomento.",s:"Jehovah rescues from mire, remembers courageous kindness, protects via unbelievers, blesses obedience.",tl_s:"Inililigtas ni Jehova mula sa putik, naalala matapang na kabaitan, nagpoprotekta sa pamamagitan ng di-mananampalataya, pinagpapala ang pagsunod."}],tl_wtTitle:"Tulungan ang Iba na Makilalang Mabuti si Jehova",tl_congTitle:"Tama ang Naging Desisyon Niya - Moises",tl_label:"Setyembre 28 - Oktubre 4, 2026 - Jeremias 38-39",tl_theme:'"Para magkaroon sila ng buhay na walang hanggan, kailangan nilang makilala ka, ang tanging tunay na Diyos." — Juan 17:3',theme:'"This means everlasting life, their coming to know you, the only true God." — John 17:3',gemsTitle:"Continue Helping One Another",tl_gemsTitle:"Patuloy Nating Tulungan ang Isa't Isa",gemsReading:"Jeremiah 38-39",tl_gemsReading:"Jeremias 38-39",wtTheme:'"This means everlasting life, their coming to know you, the only true God." — John 17:3',tl_wtTheme:'"Ito ay nangangahulugan ng buhay na walang hanggan, ang pagkilala nila sa iyo, ang tanging tunay na Diyos." — Juan 17:3'},"2026-10-05":{label:"Oct 5-11, 2026 - Jeremiah 40-41",tl_label:"Oktubre 5-11, 2026 - Jeremias 40-41",wtTitle:"Resist Satan's Tactics—Trust In Jehovah and In Jesus",tl_wtTitle:"Labanan si Satanas—Magtiwala kay Jehova at kay Jesus",congTitle:"Go In to Pharaoh - Moses",tl_congTitle:"Pumunta Ka sa Paraon - Moises",theme:'"Oppose the Devil, and he will flee from you." — James 4:7',tl_theme:'"Labanan ninyo ang Diyablo, at lalayo siya sa inyo." — Sant. 4:7',wt:[{n:"1",q:"What tactic does Satan use to try to draw us away from Jehovah?",tl_q:"Anong pakana ang ginagamit ni Satanas para iwan natin si Jehova?",en_main:"The paragraph says: Satan often disguises himself as an angel of light. 2 Corinthians 11:14 says he pretends to be good to make his lies believable. He does not always attack with obvious wickedness; he can use half-truths, doubts about Jehovah's love, or suggestions that Jehovah's standards are too strict. Recognizing this disguise helps me not to be naive about his tactics.",tl_main:"Sinasabi sa parapo: MULA nang magpasiya tayong maglingkod kay Jehova, naging kaaway na natin si Satanas at ang mga demonyo. Pero alam ni Satanas na hindi niya tayo matatalo hangga’t nananatili tayong malapít kay Jehova at tinutulungan Niya tayo.",en_add1:"It teaches us: James 1:14, 15 shows Satan also works through our own desires. He plants a thought that looks innocent, and if we keep thinking about it, it can grow into wrong action. So the tactic is not always external pressure; it can be an internal suggestion we nurture.",tl_add1:"Itinuturo nito: Kaya gusto ni Satanas na iwan natin si Jehova par a mawala sa atin ang suporta Niya. Ang isang paraan na ginagamit ni Satanas par a magawa iyan ay paniwalain tayo na hindi tayo mahal ni Jehova at ni Jesus.",en_add2:"Application - how to imitate: A practical defense is to ask: Does this thought make Jehovah seem harsh and Satan seem reasonable? If yes, that is likely Satan's spin. I want to pause, pray, and compare the thought with what I know about Jehovah's personality from the Bible.",tl_add2:"Aplikasyon - paano tularan: — 2Cor. 11:14; Sant.",en_quick:"Satan disguises lies as light to make distrust seem reasonable.",tl_quick:"MULA nang magpasiya tayong maglingkod kay Jehova, naging kaaway na natin si Satanas at ang mga demonyo."},{n:"2",q:"Why do we need complete trust in Jehovah and Jesus during spiritual warfare?",tl_q:"Bakit mahalagang magtiwala tayo sa Diyos na Jehova at kay Jesu-Kristo?",en_main:"The paragraph says: Ephesians 6:12 says our struggle is against wicked spirit forces, not just human problems. We cannot win a spiritual battle with human wisdom alone. Complete trust in Jehovah and Jesus means relying on their guidance through the Bible, congregation, and prayer rather than on our own ideas. That trust keeps us from acting alone and becoming vulnerable.",tl_main:"Sinasabi sa parapo: Sa isang labanan, kailangang magtiwala ng mga sundalo sa mga lider nila. Kasi kung hindi, baka magkani-kaniya na sila at manganib ang buhay nila.",en_add1:"It teaches us: Jesus has already defeated Satan in the sense that he remained faithful under test and was given all authority. Trusting Jesus means following his example of relying on Scripture when tempted, as he did in the wilderness.",tl_add1:"Itinuturo nito: Masasabi ring mga sundalo tayo, kasi may espirituwal tayong pakikipaglaban sa “hukbo ng napakasasamang espiritu.” ( Efe. 6:12 ) Alam ni Satanas na kung mawawalan tayo ng tiwala sa Diyos na Jehova at kay Jesu-Kristo, malamang na hindi na tayo sumunod sa kanila.",en_add2:"Application - how to imitate: In practical terms, trust shows when we seek spiritual guidance before making big decisions, especially when under emotional pressure. That pause for prayer can prevent a hasty step Satan wants us to take.",tl_add2:"Aplikasyon - paano tularan: Kaya ginagawa niya ang lahat para pagdudahan natin sila. Sa artikulong ito, tatalakayin natin kung paano ginagamit ni Satanas ang pakanang iyan mula noon hanggang ngayon.",en_quick:"We need full trust because our fight is spiritual, not just human.",tl_quick:"Sa isang labanan, kailangang magtiwala ng mga sundalo sa mga lider nila."},{n:"3",q:"How did Satan weaken Eve's trust in Jehovah?",tl_q:"Paano sinira ni Satanas ang tiwala ni Eva kay Jehova?",en_main:"The paragraph says: In Genesis 3:1-6, Satan through a serpent planted doubt with a question: 'Did God really say?' Then he twisted Jehovah's motive, implying Jehovah was withholding something good and that Eve would not die. He made disobedience look like enlightenment. Eve started looking at the tree differently after listening. Doubt about Jehovah's goodness made the forbidden look desirable.",tl_main:"Sinasabi sa parapo: Di-nagtagal matapos lalangin sina Adan at Eva, kumilos na si Satanas para ilayo sila kay Jehova. Tinanong ni Satanas si Eva: “T alaga bang sinabi ng Diyos na hindi kayo puwedeng kumain ng bunga mula sa lahat ng puno sa hardin?” ( Gen.",en_add1:"It teaches us: Satan's method is still the same: first make us question whether Jehovah really said or means what He says, then make Jehovah's limits feel unjust. If we entertain the question, our view can shift without us noticing.",tl_add1:"Itinuturo nito: 3: 1-5 ) Gusto niyang isipin ni Eva na masyadong istrikto si Jehova at na may ipinagdadamot Siya sa kanilang mag-asawa. Nakakalungkot, naniwala si Eva sa kasinungaling iyon.",en_add2:"To resist, I can answer Satan's 'Did God really say?' with 'Yes, and here is why His way is loving.' Recalling past experiences where Jehovah's way protected me strengthens trust.",tl_add2:"Aplikasyon - paano tularan: Pumanig sila ni Adan kay Satanas. Iniwan nila si Jehova, ang nagbigay sa kanila ng lahat.",en_quick:"Satan weakened Eve by making Jehovah's loving limit seem unjust.",tl_quick:"Di-nagtagal matapos lalangin sina Adan at Eva, kumilos na si Satanas para ilayo sila kay Jehova."},{n:"4",q:"How does Satan try to make us doubt Jehovah's and Jesus' love?",tl_q:"Noong panahon ni Job, anong kasinungalingan tungkol kay Jehova ang ipinakalat ni Satanas?",en_main:"The paragraph says: Satan wants us to interpret hardships as proof that Jehovah does not care. When prayers seem unanswered or we feel alone, he whispers that Jehovah is distant and Jesus is disappointed. But Romans 8:35-39 assures us nothing can separate us from God's love. Feelings can fluctuate, but Jehovah's love is stable, proven by Jesus' ransom.",tl_main:"Sinasabi sa parapo: Ipinagpatuloy ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova. Halimbawa, ginamit ni Satanas ang tatlong kasamahan ni Job par a magsabi ng mga bagay na di-totoo tungkol kay Jehova.",en_add1:"It teaches us: Satan also uses comparisons. Seeing others' privileges or happy photos can make us feel less loved. Remembering that Jehovah's love is personal, not comparative, helps.",tl_add1:"Itinuturo nito: Gusto ni Satanas na maniwala si Job na hindi siya mahal ni Jehova at na hindi pinapahalagahan ni Jehova ang katapatan niya. ( Job 22: 1-3 ) Inakala ng Diyablo na kapag nakaranas ng tr ahedya si Job, iiwan nito si Jehova.",en_add2:"I can counter doubts by listing evidences of Jehovah's care in my life — an answered prayer, a timely scripture, help from brothers. Gratitude journal weakens Satan's narrative.",tl_add2:"Aplikasyon - paano tularan: Pero kahit nagdusa si Job, nanatili pa rin siyang tapat at pinahalagahan niya ang pakikipagkaibigan niya sa Diyos. — Job 27: 1,5.",en_quick:"Satan uses hardships to make Jehovah's love feel distant, but Romans 8 says nothing can separate us.",tl_quick:"Ipinagpatuloy ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova."},{n:"5",q:"How can we strengthen our trust when doubts arise?",tl_q:"Paano tinangka ni Satanas na pigilan ang mga tao sa pagsunod kay Jesus?",en_main:"The paragraph says: When doubts appear, I want to check facts before accepting suspicion. That means returning to what the Bible says about Jehovah's personality — patient, just, loving — and to how Jesus treated people. Praying specifically about the doubt, not just generally, invites Jehovah to help my thinking. Talking to a mature brother can also provide perspective I lack alone.",tl_main:"Sinasabi sa parapo: ( Mateo 11:19 ) Pagkalipas ng maraming taon, tinangka naman ni Satanas na pigilan ang mga tao sa pagsunod kay Jesus. Ginamit niya ang mga lider ng relihiyon at ang iba pang galít kay Jesus para magpakalat ng mga kasinungalingan tungkol kay Jesus.",en_add1:"It teaches us: Meditating on the ransom helps. If Jehovah gave His Son for me, would He abandon me over a mistake? That logic, from Romans 8:32, rebuilds trust quickly.",tl_add1:"Itinuturo nito: Dahil diyan, inakusahan ng mga tao si Jesus na kriminal at ipinapatay siya. — Basahin ang Mateo 11:19; 27: 27-31; Mar.",en_add2:"Application - how to imitate: Keeping a record of how Jehovah has helped in the past — what the psalmist did — turns vague doubts into concrete memories of care.",tl_add2:"Aplikasyon - paano tularan: — Basahin ang Mateo 11:19; 27: 27-31; Mar.",en_quick:"When doubts come, check Bible facts about Jehovah and remember past help.",tl_quick:"( Mateo 11:19 ) Pagkalipas ng maraming taon, tinangka naman ni Satanas na pigilan ang mga tao sa pagsunod kay Jesus."},{n:"6-7",q:"How can we strengthen our trust when doubts arise?",tl_q:"Paano tinangka ni Satanas na pahintuin ang mga alagad ni Jesus noon sa pangangaral?",en_main:"The paragraph says: When doubts appear, I want to check facts before accepting suspicion. That means returning to what the Bible says about Jehovah's personality — patient, just, loving — and to how Jesus treated people. Praying specifically about the doubt, not just generally, invites Jehovah to help my thinking. Talking to a mature brother can also provide perspective I lack alone.",tl_main:"Sinasabi sa parapo: ( Mateo 11:19 ) Pagkalipas ng maraming taon, tinangka naman ni Satanas na pigilan ang mga tao sa pagsunod kay Jesus. Ginamit niya ang mga lider ng relihiyon at ang iba pang galít kay Jesus para magpakalat ng mga kasinungalingan tungkol kay Jesus.",en_add1:"It teaches us: Meditating on the ransom helps. If Jehovah gave His Son for me, would He abandon me over a mistake? That logic, from Romans 8:32, rebuilds trust quickly.",tl_add1:"Itinuturo nito: Dahil diyan, inakusahan ng mga tao si Jesus na kriminal at ipinapatay siya. — Basahin ang Mateo 11:19; 27: 27-31; Mar.",en_add2:"Application - how to imitate: Keeping a record of how Jehovah has helped in the past — what the psalmist did — turns vague doubts into concrete memories of care.",tl_add2:"Aplikasyon - paano tularan: — Basahin ang Mateo 11:19; 27: 27-31; Mar.",en_quick:"When doubts come, check Bible facts about Jehovah and remember past help.",tl_quick:"( Mateo 11:19 ) Pagkalipas ng maraming taon, tinangka naman ni Satanas na pigilan ang mga tao sa pagsunod kay Jesus."},{n:"8",q:"What practical steps can we take daily to resist Satan's tactics?",tl_q:"Paano ginagamit ni Satanas ang huwad na relihiyon para magpakalat ng kasinungalingan tungkol kay Jehova at kay Jesus?",en_main:"The paragraph says: Ephesians 6:11 says put on the complete suit of armor from God. Practically, that means daily Bible reading to have truth as belt, cultivating righteousness as breastplate by doing what is right even in small things, and keeping peace of good news as footwear by sharing when possible. Prayer keeps armor tied together. Small daily habits make big resistance possible.",tl_main:"Sinasabi sa parapo: Sa ngayon, isa pa rin sa mga pakana ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova at kay Jesus. Si Satanas ang “ ama ng kasinungalingan,” at ginagamit niya ang huwad na relihiyon par a dayain ang mga tao.",en_add1:"It teaches us: Also, being careful with entertainment and associations. Satan often introduces doubts through media that normalizes disobedience or mocks Jehovah's standards.",tl_add1:"Itinuturo nito: ( Juan 8:44 ) Dahil sa mga maling turo, nabulag ang isip ng mga tao kaya hindi nila kilala kung sino talaga si Jehova at ang Anak niya. ( 2Cor.",en_add2:"Application - how to imitate: Regular meeting attendance keeps armor checked by brothers who can notice when a piece is loose.",tl_add2:"Aplikasyon - paano tularan: 4: 3,4 ) Halimbawa, itinuturo ng ilang r elihiyon na iisa lang si Jesus at ang Ama. Dahil diyan, hindi na naiisip ng mga tao na kilalanin ang Ama o alamin ang pangalan niya, at ang Anak ang sinasamba nila.",en_quick:"Daily armor — Bible, righteousness, good news, prayer — resists Satan.",tl_quick:"Sa ngayon, isa pa rin sa mga pakana ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova at kay Jesus."},{n:"9",q:"What practical steps can we take daily to resist Satan's tactics?",tl_q:"Paano ginagamit ni Satanas ang huwad na relihiyon para pigilan ang mga tao na maging malapit kay Jehova?",en_main:"The paragraph says: Ephesians 6:11 says put on the complete suit of armor from God. Practically, that means daily Bible reading to have truth as belt, cultivating righteousness as breastplate by doing what is right even in small things, and keeping peace of good news as footwear by sharing when possible. Prayer keeps armor tied together. Small daily habits make big resistance possible.",tl_main:"Sinasabi sa parapo: Sa ngayon, isa pa rin sa mga pakana ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova at kay Jesus. Si Satanas ang “ ama ng kasinungalingan,” at ginagamit niya ang huwad na relihiyon par a dayain ang mga tao.",en_add1:"It teaches us: Also, being careful with entertainment and associations. Satan often introduces doubts through media that normalizes disobedience or mocks Jehovah's standards.",tl_add1:"Itinuturo nito: ( Juan 8:44 ) Dahil sa mga maling turo, nabulag ang isip ng mga tao kaya hindi nila kilala kung sino talaga si Jehova at ang Anak niya. ( 2Cor.",en_add2:"Application - how to imitate: Regular meeting attendance keeps armor checked by brothers who can notice when a piece is loose.",tl_add2:"Aplikasyon - paano tularan: 4: 3,4 ) Halimbawa, itinuturo ng ilang r elihiyon na iisa lang si Jesus at ang Ama. Dahil diyan, hindi na naiisip ng mga tao na kilalanin ang Ama o alamin ang pangalan niya, at ang Anak ang sinasamba nila.",en_quick:"Daily armor — Bible, righteousness, good news, prayer — resists Satan.",tl_quick:"Sa ngayon, isa pa rin sa mga pakana ni Satanas ang pagpapakalat ng kasinungalingan tungkol kay Jehova at kay Jesus."},{n:"10",q:"What does Satan do to make us distrust Jehovah's organization?",tl_q:"Bakit posibleng magalit ang isang Kristiyano kay Jehova?",en_main:"The paragraph discusses what does satan do to make us distrust jehovah's organization? Based on scriptures cited in the article.",tl_main:"Sinasabi sa parapo ang tungkol sa: Ano ang ginagawa ni Satanas para hindi tayo magtiwala sa organisasyon ni Jehova? Batay sa mga tekstong binanggit sa artikulo.",en_add1:"It teaches us that Satan's tactics are subtle and we need to recognize them.",tl_add1:"Itinuturo nito na tuso ang mga pakana ni Satanas at kailangan natin itong makilala.",en_add2:"I will apply this by remembering how Jehovah and Jesus have helped me and by staying close to the congregation.",tl_add2:"Isasabuhay ko ito sa pamamagitan ng pag-alala kung paano ako tinulungan ni Jehova at ni Jesus at sa pamamagitan ng pananatiling malapit sa kongregasyon.",en_quick:"What does Satan do to make us distrust Jehovah's organization?",tl_quick:"Ano ang ginagawa ni Satanas para hindi tayo magtiwala sa organisasyon ni Jehova?"},{n:"11",q:"Why should we not listen to what people say is right and wrong?",tl_q:"Ano ang ginagawa ni Satanas para pagdudahan natin ang mga pamantayan ni Jehova?",en_main:"The paragraph discusses why should we not listen to what people say is right and wrong? Based on scriptures cited in the article.",tl_main:"Sinasabi sa parapo ang tungkol sa: Bakit hindi tayo dapat makinig sa sinasabi ng mga tao na tama at mali? Batay sa mga tekstong binanggit sa artikulo.",en_add1:"It teaches us that Satan's tactics are subtle and we need to recognize them.",tl_add1:"Itinuturo nito na tuso ang mga pakana ni Satanas at kailangan natin itong makilala.",en_add2:"I will apply this by remembering how Jehovah and Jesus have helped me and by staying close to the congregation.",tl_add2:"Isasabuhay ko ito sa pamamagitan ng pag-alala kung paano ako tinulungan ni Jehova at ni Jesus at sa pamamag esus have helped me and by staying close to the congregation.",tl_add2:"Isasabuhay ko ito sa pamamagitan ng pag-alala kung paano ako tinulungan ni Jehova at ni Jesus at sa pamamagitan ng pananatiling malapit sa kongregasyon.",en_quick:"Why is it good to remember our past experiences with Jehovah?",tl_quick:"Bakit magandang alalahanin natin ang mga karanasan natin kasama si Jehova?"},{n:"16",q:"In John 10, what does Jesus assure all who remain close to Him?",tl_q:"Bakit magandang alalahanin natin ang mga karanasan natin o pakinggan ang mga karanasan ng iba?",en_main:"The paragraph discusses in john 10, what does jesus assure all who remain close to him? Based on scriptures cited in the article.",tl_main:"Sinasabi sa parapo ang tungkol sa: Sa Juan 10, ano ang tinitiyak ni Jesus sa lahat ng nananatiling malapit sa kaniya at sa Ama? Batay sa mga tekstong binanggit sa artikulo.",en_add1:"It teaches us that Satan's tactics are subtle and we need to recognize them.",tl_add1:"Itinuturo nito na tuso ang mga pakana ni Satanas at kailangan natin itong makilala.",en_add2:"I will apply this by remembering how Jehovah and Jesus have helped me and by staying close to the congregation.",tl_add2:"Isasabuhay ko ito sa pamamagitan ng pag-alala kung paano ako tinulungan ni Jehova at ni Jesus at sa pamamagitan ng pananatiling malapit sa kongregasyon.",en_quick:"In John 10, what does Jesus assure all who remain close to Him?",tl_quick:"Sa Juan 10, ano ang tinitiyak ni Jesus sa lahat ng nananatiling malapit sa kaniya at sa Ama?"},{n:"17",q:"Question 17",tl_q:"Sa Juan 10:29, ano ang tinitiyak ni Jesus sa lahat ng nananatiling malapit sa kaniya at sa kaniyang Ama?",en_main:"The paragraph explains Satan's tactic.",tl_main:"Ipinaliliwanag sa parapo ang pakana ni Satanas.",en_add1:"It teaches us to trust Jehovah and Jesus.",tl_add1:"Itinuturo nito na magtiwala kay Jehova at kay Jesus.",en_add2:"I will resist by remembering Jehovah's love and staying close to congregation.",tl_add2:"Lalabanan ko sa pamamagitan ng pag-alala sa pag-ibig ni Jehova at pananatiling malapit sa kongregasyon.",en_quick:"",tl_quick:""},{n:"18",q:"Question 18",tl_q:"Ano ang tatalakayin natin sa susunod na artikulo?",en_main:"The paragraph explains Satan's tactic.",tl_main:"Ipinaliliwanag sa parapo ang pakana ni Satanas.",en_add1:"It teaches us to trust Jehovah and Jesus.",tl_add1:"Itinuturo nito na magtiwala kay Jehova at kay Jesus.",en_add2:"I will resist by remembering Jehovah's love and staying close to congregation.",tl_add2:"Lalabanan ko sa pamamagitan ng pag-alala sa pag-ibig ni Jehova at pananatiling malapit sa kongregasyon.",en_quick:"",tl_quick:""}],cong:[{n:"For Discussion",q:"In what ways did Moses show courage during this part of his life?",tl_q:"Sa anong mga paraan nagpakita ng lakas ng loob si Moises sa bahaging ito ng buhay niya?",en_main:"At 80, Moses was told to go back to Pharaoh, most powerful ruler, demand Israel's release. Despite being slow of speech and away 40 years, he obeyed, repeatedly went to Pharaoh, announced plagues, led Israel out, and at Red Sea stretched hand in faith and Jehovah parted sea.",tl_main:"Nang 80 anyos, sinabihan si Moises na bumalik kay Paraon, pinakamakapangyarihang pinuno, hilingin palayain Israel. Kahit mabagal magsalita at 40 taon wala, sumunod siya, paulit-ulit pumunta kay Paraon, inihayag salot, pinangunahan Israel palabas, at sa Dagat na Pula iniunat kamay nang may pananampalataya at hinati ni Jehova dagat.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"1",q:"The Pharaoh of this period is unnamed and no Egyptian record of the Exodus has yet been found. Why is it reasonable to believe this Bible account? (g04 4/8 7 ¶1-3)",tl_q:"Hindi natukoy ang pangalan ng Paraon sa ulat na ito, at wala pa ring nakikitang rekord ng mga taga-Ehipto tungkol sa pag-alis ng mga Israelita sa Ehipto. Pero bakit makatwirang paniwalaan pa rin ang ulat na ito ng Bibliya? (g04 4/8 7 ¶1-3)",en_main:"Egyptians did not record defeats, Pharaohs erased humiliation. Exodus 40 years before written, Egyptians would not memorialize losing slave labor. Bible details of store cities, straw bricks, Semitic slaves fits archaeology, reasonable.",tl_main:"Hindi inirerekord ng Egipcio ang pagkatalo, binubura ni Paraon kahihiyan. Exodo 40 taon bago isulat, ayaw alalahanin pagkawala ng alipin. Detalye ng Bibliya tungkol sa lunsod-imbakan, laryong may dayami, aliping Semitiko kaayon ng arkeolohiya, makatwiran.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"2",q:"Why did people fear Pharaoh? (w14 4/15 8 ¶1) Picture A",tl_q:"Bakit takot ang mga tao sa Paraon? (w14 4/15 8 ¶1) Larawan A",en_main:"Pharaoh considered living god with absolute power over life and death, could kill without trial. Exodus and w14 4/15 explains opposing him risked death.",tl_main:"Si Paraon itinuring na buhay na diyos na may absolute kapangyarihan sa buhay at kamatayan, puwedeng pumatay nang walang paglilitis. Exodo at w14 4/15 nagpapaliwanag paglaban sa kaniya ay panganib sa buhay.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"3",q:"How did the Ten Plagues humiliate the gods of Egypt? (“When God Brought Egypt to Ruin,” w04 3/15 24-25)",tl_q:"Paano ipinakita ng Sampung Salot na walang-wala ang mga diyos ng mga Egipcio? (“Nang Wasakin ng Diyos ang Ehipto,” w04 3/15 24-25)",en_main:"Each plague targeted Egyptian god: Nile to Hapi, frogs to Heqet, darkness to Ra. Jehovah showed them powerless, proved true God above all.",tl_main:"Bawat salot tumama sa diyos ng Ehipto: Ilog Nilo kay Hapi, palaka kay Heqet, kadiliman kay Ra. Ipinakita ni Jehova na walang kapangyarihan mga iyon, pinatunayan tunay na Diyos higit sa lahat.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"4",q:"What indicates that Jehovah opened up a wide channel through the Red Sea, and how many Israelites may have crossed through? (it “Exodus” 1247 ¶2; Picture B)",tl_q:"Bakit masasabing malapad ang daang binuksan ni Jehova sa Dagat na Pula, at gaano karaming Israelita ang posibleng tumawid doon? (it “Exodo” 1247 ¶2; Larawan B)",en_main:"Exodus 14:16 Moses split sea, Israel went dry ground. All Israel about 3 million plus livestock crossed one night, indicating channel perhaps kilometer wide, walls of water, not shallow.",tl_main:"Exodo 14:16 hinati ni Moises dagat, tumawid Israel sa tuyong lupa. Buong Israel mga 3 milyon plus alagang hayop tumawid isang gabi, nagpapahiwatig na daan baka kilometro lapad, pader ng tubig, hindi mababaw.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"5",q:"How can Moses' example of courage help us when we feel unqualified to fulfill an assignment? (Ex. 4:10-16)",tl_q:"Paano nakatutulong ang halimbawa ni Moises kapag pakiramdam mong hindi mo kayang gampanan ang atas mo? (Ex. 4:10-16)",en_main:"Moses felt unqualified saying 'I am not eloquent.' Jehovah patiently taught, gave Aaron as spokesman, showed signs. Teaches Jehovah does not expect perfection, trains and provides help.",tl_main:"Nadama ni Moises na hindi kuwalipikado sinabing 'hindi ako mahusay magsalita.' Matiising tinuruan ni Jehova, binigyan si Aaron bilang tagapagsalita, nagpakita ng tanda. Nagtuturo na hindi inaasahan ni Jehova perpekto, sinasanay at nagbibigay tulong.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"6",q:"Just as Aaron helped Moses to fulfill his assignment courageously, how can you help your brothers and sisters today? (Ex. 4:14-20) Picture C",tl_q:"Kung paanong tinulungan ni Aaron si Moises para magampanan ang atas niya nang may lakas ng loob, paano mo matutulungan ang mga kapatid ngayon? (Ex. 4:14-20) Larawan C",en_main:"Aaron spoke for Moses and supported before Pharaoh and Israel. Today help brothers by assisting talks, encouraging, going in service, helping practical needs with assignments.",tl_main:"Si Aaron nagsalita para kay Moises at sumuporta sa harap ni Paraon at Israel. Ngayon matutulungan kapatid sa pag-assist sa talk, pag-eencourage, pagsama sa ministry, pagtulong sa praktikal na pangangailangan kapag may atas.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"7",q:"How might you imitate the courage shown by Moses in this account?",tl_q:"Paano mo matutularan ang lakas ng loob ni Moises?",en_main:"Imitate by obeying even when scary, trusting Jehovah gives words and strength, not giving up after initial failure as when Pharaoh first refused.",tl_main:"Matutularan sa pagsunod kahit nakakatakot, nagtitiwala na bibigyan ni Jehova ng salita at lakas, hindi pagsuko matapos unang kabiguan gaya nang tumanggi si Paraon sa unang pagkakataon.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"8",q:"What does this account teach you about Jehovah?",tl_q:"Ano ang itinuturo ng ulat na ito tungkol kay Jehova?",en_main:"Jehovah is patient, powerful, purposeful, hears cries of oppressed, gives second chances, uses imperfect people, will become whatever needed to help.",tl_main:"Si Jehova matiisin, makapangyarihan, may layunin, naririnig daing ng inaapi, nagbibigay pangalawang pagkakataon, gumagamit ng di-perpektong tao, magiging anuman kailangan para tumulong.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"9",q:"How does this account fit in with Jehovah's purposes?",tl_q:"Ano ang koneksiyon ng ulat na ito sa layunin ni Jehova?",en_main:"Jehovah's purpose to deliver Israel to Promised Land fulfilled through Moses, pointed to greater deliverance through Jesus, shows Jehovah keeps promises to Abraham.",tl_main:"Layunin ni Jehova na iligtas Israel sa Lupang Pangako natupad sa pamamagitan ni Moises, tumuturo sa mas dakilang pagliligtas sa pamamagitan ni Jesus, nagpapakita na tinutupad ni Jehova pangako kay Abraham.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."},{n:"10",q:"If in the new world you could talk to Moses about this part of his life, what would you ask him?",tl_q:"Kung sa bagong sanlibutan ay makakausap mo si Moises tungkol sa bahaging ito ng buhay niya, ano ang itatanong mo sa kaniya?",en_main:"How felt when saw Red Sea part, how Jehovah comforted when Israel complained, how kept meekness despite authority.",tl_main:"Ano naramdaman nang makita nahati Dagat na Pula, paano ka inaliw ni Jehova nang magreklamo Israel, paano mo napanatili kaamuan sa kabila ng malaking awtoridad.",en_add1:"Strengthens faith Jehovah can deliver from powerful enemies.",tl_add1:"Pinatitibay pananampalataya na kayang iligtas ni Jehova mula sa makapangyarihang kaaway.",en_add2:"Apply by trusting Jehovah when facing authorities or hard assignments.",tl_add2:"Maia-apply sa pagtitiwala kay Jehova kapag humaharap sa awtoridad o mahihirap na atas.",en_quick:"Moses obeyed despite fear; Jehovah showed power over Pharaoh.",tl_quick:"Sumunod si Moises sa kabila ng takot; ipinakita ni Jehova kapangyarihan laban kay Paraon."}],gems:[{q:"Jer 40:12—How does this verse confirm that Jehovah gave his people the good land described in Deuteronomy 8:6-8? (w06 6/15 16 ¶4)",tl_q:"Jer 40:12—Paano pinapatunayan ng tekstong ito na ibinigay ni Jehova sa bayan niya ang magandang lupain na sinabi sa Deuteronomio 8:6-8? (w06 6/15 16 ¶4)",a:`Jer 40:12 says Jews who scattered in Moab, Ammon, Edom returned when they heard Babylon left a remnant and appointed Gedaliah. They gathered wine and summer fruits in very large quantities. This was right after Jerusalem was destroyed — supposedly desolate. Yet it still produced abundantly.

Deut 8:6-8 describes Promised Land as good land of wheat, barley, vines, figs, pomegranates, olives, honey — a land not lacking anything. The huge harvest in Jer 40:12 even after war confirms Jehovah had given them that good fertile land He promised. (w06 6/15 16 ¶4)`,tl_a:`Sinasabi sa Jer 40:12 na ang mga Judiong nagkawatak-watak sa Moab, Ammon, Edom ay bumalik nang mabalitaang may iniwang nalabi ang Babilonya at itinalaga si Gedalias. Nag-ani sila ng napakaraming alak at prutas. Ito ay pagkatapos wasakin ang Jerusalem — akala disyerto na. Pero nagbunga pa rin nang sagana.

Inilalarawan sa Deut 8:6-8 ang Lupang Pangako bilang mabuting lupain ng trigo, sebada, ubas, igos, granada, olibo, pulot — lupaing hindi pagkukulangin. Ang malaking ani sa Jer 40:12 kahit pagkatapos ng digmaan ay nagpapatunay na ibinigay nga ni Jehova ang mabuti at matabang lupaing ipinangako Niya. (w06 6/15 16 ¶4)`,c:"Even when land looked ruined, it produced abundantly because Jehovah blessed it. His promises about provision are true and Paradise will be truly good.",tl_c:"Kahit mukhang wasak na ang lupain, nagbunga pa rin nang sagana dahil pinagpala ni Jehova. Totoo ang mga pangako Niya sa paglalaan at magiging tunay na mabuti ang Paraiso.",s:"Huge harvest after destruction proves land was still good land promised in Deut 8:6-8.",tl_s:"Napakalaking ani pagkatapos ng pagkawasak ay nagpapatunay na mabuti pa ring lupain na ipinangako sa Deut 8:6-8."},{q:"What spiritual gems from this week's Bible reading would you like to share?",tl_q:"Sa pagbabasa ng Bibliya para sa linggong ito, anong espirituwal na hiyas ang nagustuhan mo?",a:`Jer 40:2-4 — Nebuzaradan freed Jeremiah, said Jehovah foretold calamity, offered choice to go to Babylon with care or stay.
Gem: Even unbelievers can recognize Jehovah's hand; Jeremiah humbly chose remnant over comfort.
Application today: We may have a choice between comfortable assignment and harder one that helps congregation. Imitate Jeremiah — choose what helps Jehovah's people, not just comfort. Also, our good conduct may make even non-Witnesses see Jehovah is with us.

Jer 40:6 — Jeremiah went to Gedaliah at Mizpah and dwelt with people left in land.
Gem: Stay with Jehovah's people even when conditions are hard and ruined.
Application: When congregation faces problems — few publishers, old Kingdom Hall, trials — don't abandon. Stay and strengthen like Jeremiah. This is our family.

Jer 40:8 — Ishmael, Johanan and others came to Gedaliah.
Gem: Community still exists after disaster; unity needed.
Application: After a calamity or personal disaster, gather with brothers. We recover better together than alone. Attend meetings even when life feels ruined.

Jer 40:10 — Gedaliah told them to gather wine, fruits, oil and dwell in cities and take initiative.
Gem: Be industrious and take initiative to provide.
Application: Even in hard times, be hardworking — at work, at home, in congregation. Don't wait for perfect conditions; gather what Jehovah provides now.

Jer 40:12 — Huge harvest of wine and summer fruits after destruction.
Gem: Jehovah provides abundantly even in ruins, confirming good land promise.
Application: Even when economy is bad or we lose job, Jehovah still provides. Trust His promise that Paradise earth will be truly abundant.

Jer 40:14 — Johanan warned Gedaliah that Ishmael wants to kill him.
Gem: Listen to credible warnings from mature brothers.
Application: If elders or mature friends warn about dangerous association, online trap, or bad business deal, listen. Don't be naive like Gedaliah.

Jer 41:2,3 — Ishmael murdered Gedaliah and those with him at meal.
Gem: Don't be naive; love balanced with wisdom protects.
Application: Today, not everyone who eats with us has good motives. Be hospitable but discerning, especially with those who show violent or dishonest traits.

Jer 41:5 — Eighty men coming with offerings to house of Jehovah.
Gem: Some still want to worship Jehovah even after tragedy.
Application: Even after personal tragedy, keep worshipping. Like those 80 men, continue spiritual routine — meetings, personal study — despite sadness.

Jer 41:11-15 — Johanan and army rescued captives from Ishmael.
Gem: Brave brothers who act to protect flock are needed.
Application: In congregation, if we see bullying, injustice, or someone being led astray, have courage like Johanan to intervene kindly and rescue.

Jer 41:18 — They were afraid of Chaldeans because Ishmael killed Gedaliah who was appointed by Babylon.
Gem: One person's bad act can make whole community afraid and suffer.
Application: Our actions affect whole congregation. If we do something dishonest or immoral, it can bring reproach and fear to others. Act responsibly.`,tl_a:`Jer 40:2-4 — Pinalaya ni Nebuzaradan si Jeremias, sinabi inihula ni Jehova ang kapahamakan, inalok na pumunta sa Babilonya na aalagaan o manatili.
Hiyas: Kahit di-mananampalataya nakikilala ang kamay ni Jehova; mapagpakumbabang pinili ni Jeremias ang nalabi kaysa ginhawa.
Aplikasyon ngayon: Maaaring may pagpipilian tayo sa komportableng atas at mahirap na atas na makakatulong sa kongregasyon. Gayahin si Jeremias — piliin ang makakatulong sa bayan ni Jehova, hindi lang ginhawa. At ang mabuti nating paggawi ay maaaring makita ng di-Saksi na kasama natin si Jehova.

Jer 40:6 — Pumunta si Jeremias kay Gedalias sa Mizpa at nanirahan sa naiwan sa lupain.
Hiyas: Manatili kasama ng bayan ni Jehova kahit mahirap at wasak.
Aplikasyon: Kapag may problema ang kongregasyon — kakaunti, luma ang Kingdom Hall, may pagsubok — huwag iwan. Manatili at magpatibay gaya ni Jeremias. Pamilya natin ito.

Jer 40:8 — Dumating sina Ismael, Johanan at iba kay Gedalias.
Hiyas: May komunidad pa rin pagkatapos ng sakuna; kailangan ng pagkakaisa.
Aplikasyon: Pagkatapos ng kalamidad o personal na sakuna, makisama sa mga kapatid. Mas mabilis tayong makaka-recover nang magkakasama kaysa mag-isa. Dumalo kahit wasak ang buhay.

Jer 40:10 — Sinabi ni Gedalias na mag-ani ng alak, prutas, langis at manirahan sa mga lunsod at magkusa.
Hiyas: Maging masipag at magkusa na maglaan.
Aplikasyon: Kahit mahirap, maging masipag — sa trabaho, bahay, kongregasyon. Huwag maghintay ng perpektong kondisyon; anihin ang inilalaan ni Jehova ngayon.

Jer 40:12 — Napakalaking ani ng alak at prutas pagkatapos ng pagkawasak.
Hiyas: Naglalaan si Jehova nang sagana kahit sa guho, patunay ng magandang lupain.
Aplikasyon: Kahit masama ekonomiya o mawalan ng trabaho, naglalaan pa rin si Jehova. Magtiwala sa pangako Niya na magiging tunay na sagana ang Paraiso.

Jer 40:14 — Binalaan ni Johanan si Gedalias na gusto siyang patayin ni Ismael.
Hiyas: Makinig sa kapani-paniwalang babala ng may-gulang na kapatid.
Aplikasyon: Kung binalaan tayo ng matatanda o may-gulang na kaibigan tungkol sa mapanganib na kasama, online trap, o masamang negosyo, makinig. Huwag maging musmos gaya ni Gedalias.

Jer 41:2,3 — Pinatay ni Ismael si Gedalias at mga kasama habang kumakain.
Hiyas: Huwag maging musmos; ang pag-ibig na may karunungan ang nagpoprotekta.
Aplikasyon: Hindi lahat ng kasalo natin ay may mabuting motibo. Maging mapagpatuloy pero mapanuri, lalo na sa may marahas o di-tapat na ugali.

Jer 41:5 — Walumpung lalaki na may handog papunta sa bahay ni Jehova.
Hiyas: May mga gusto pa ring sumamba kahit pagkatapos ng trahedya.
Aplikasyon: Kahit may personal na trahedya, patuloy na sumamba. Tulad ng 80 lalaki, ipagpatuloy ang espirituwal na routine — pulong, personal study — sa kabila ng lungkot.

Jer 41:11-15 — Iniligtas ni Johanan at ng hukbo ang mga bihag mula kay Ismael.
Hiyas: Kailangan ng matatapang na kapatid na kumikilos para protektahan ang kawan.
Aplikasyon: Sa kongregasyon, kung may nakita tayong pambu-bully, di-makatarungan, o inaakay sa maling daan, lakasan ang loob gaya ni Johanan na mamagitan at magligtas.

Jer 41:18 — Natakot sila sa mga Caldeo dahil pinatay ni Ismael si Gedalias na itinalaga ng Babilonya.
Hiyas: Ang masamang gawa ng isa ay makakatakot sa buong komunidad.
Aplikasyon: Nakakaapekto sa buong kongregasyon ang kilos natin. Kung gumawa tayo ng di-tapat o imoral, maaaring magdulot ng kadustaan at takot sa iba. Kumilos nang responsable.`,c:"10 gems for Jeremiah 40-41 — humility, staying with people, listening to warnings, courage to rescue. Each short so others can comment.",tl_c:"10 hiyas para sa Jeremias 40-41 — kapakumbabaan, pananatili sa bayan, pakikinig sa babala, tapang na magligtas. Maikli bawat isa para may ibang makapagkomento.",s:"Jeremiah chose remnant over comfort, Jehovah provides in ruins, heed warnings, be courageous to rescue.",tl_s:"Pinili ni Jeremias nalabi kaysa ginhawa, naglalaan si Jehova sa guho, makinig sa babala, maging matapang magligtas."}],gemsTitle:"Does Jehovah Always Protect Us Physically?",tl_gemsTitle:"Lagi Ba Tayong Pinoprotektahan ni Jehova sa Pisikal?",gemsReading:"Jeremiah 40-41",tl_gemsReading:"Jeremias 40-41",wtTheme:'"Oppose the Devil, and he will flee from you." — James 4:7',tl_wtTheme:'"Labanan ninyo ang Diyablo, at lalayo siya sa inyo." — Santiago 4:7'}};var Zg=Sn(we(),1),Cm=Symbol.for("react.element"),qm=Symbol.for("react.fragment"),Nm=Object.prototype.hasOwnProperty,Hm=Zg.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Bm={key:!0,ref:!0,__self:!0,__source:!0};function Xg(a,n,e){var t,i={},o=null,r=null;e!==void 0&&(o=""+e),n.key!==void 0&&(o=""+n.key),n.ref!==void 0&&(r=n.ref);for(t in n)Nm.call(n,t)&&!Bm.hasOwnProperty(t)&&(i[t]=n[t]);if(a&&a.defaultProps)for(t in n=a.defaultProps,n)i[t]===void 0&&(i[t]=n[t]);return{$$typeof:Cm,type:a,key:o,ref:r,props:i,_owner:Hm.current}}var Wi=qm,p=Xg,b=Xg;var zm=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"],Lm=["Enero","Pebrero","Marso","Abril","Mayo","Hunyo","Hulyo","Agosto","Setyembre","Oktubre","Nobyembre","Disyembre"];function jg(a,n,e,t){if(n==="tl"&&t)return t.replace(" - "," • ");if(n==="en"&&e)return e.replace(" - "," • ");let i=new Date(a),o=i.getMonth(),r=i.getDate(),l=r+6,s=zm[o],d=
