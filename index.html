 kapag pinag-iisipan natin ang kaalaman, karunungan, at mga nagawa ni Jehova?",en_main:"The paragraph says Romans 11:33 shows Jehovah's wisdom and knowledge are deep beyond tracing. Contemplating that makes us feel small but also safe, because a God with such vast wisdom can handle any problem.",tl_main:"Sinasabi sa parapo na ayon sa Roma 11:33, napakalalim ng karunungan at kaalaman ni Jehova na hindi natin lubusang matunton. Kapag pinag-isipan natin ito, nadarama nating napakaliit natin pero ligtas din tayo dahil ang Diyos na may gayong karunungan ay kayang lutasin ang anumang problema.",en_add1:"It teaches us that Jehovah is not just powerful but also wise in how He uses His knowledge. He is not a distant Creator who doesn't care; His accomplishments show He uses His wisdom for our good.",tl_add1:"Itinuturo nito na si Jehova ay hindi lang makapangyarihan kundi marunong din sa paggamit ng Kanyang kaalaman. Hindi Siya malayong Tagapaglalang na walang pakialam; ang mga nagawa Niya ay nagpapakitang ginagamit Niya ang karunungan Niya para sa ikabubuti natin.",en_add2:"I will imitate humility by not pretending I know everything. Like Job, when I face something I don't understand, I will trust Jehovah's larger viewpoint and keep asking 'What does this teach me about Jehovah?' instead of complaining.",tl_add2:"Tutularan ko ang kapakumbabaan sa pamamagitan ng hindi pag-aakalang alam ko na ang lahat. Tulad ni Job, kapag may hindi ako maintindihan, magtitiwala ako sa mas malawak na pananaw ni Jehova at patuloy na magtatanong, 'Ano ang itinuturo nito tungkol kay Jehova?' sa halip na magreklamo.",en_quick:"Jehovah's wisdom is beyond tracing; that makes me humble and safe.",tl_quick:"Hindi matutunton ang karunungan ni Jehova; kaya nagiging mapagpakumbaba at panatag ako."},{n:"2",q:"What proves that we can get to know Jehovah?",tl_q:"Bakit natin nasabi na posible nating makilala si Jehova?",en_main:"The paragraph cites 1 Chronicles 28:9 - if we search for Him, He will let Himself be found. Also 1 John 5:20 says Jesus came to give us insight. So Jehovah Himself invites us to know Him.",tl_main:"Binanggit sa parapo ang 1 Cronica 28:9 — kung hahanapin natin Siya, ipapakilala Niya ang sarili Niya. Sinasabi rin ng 1 Juan 5:20 na dumating si Jesus para bigyan tayo ng kaunawaan. Kaya si Jehova mismo ang nag-aanyaya na makilala Siya.",en_add1:"It teaches that knowing Jehovah is not impossible or only for scholars. He wants even ordinary people to know Him, which shows His love and accessibility.",tl_add1:"Itinuturo nito na ang pagkilala kay Jehova ay hindi imposible o para lang sa matatalino. Gusto Niyang makilala Siya kahit ng mga karaniwang tao, na nagpapakita ng pag-ibig at pagiging lapitin Niya.",en_add2:"I will not think 'Hindi ko kaya.' I will regularly set time to search for Jehovah in the Bible, believing He will let Himself be found if I am sincere.",tl_add2:"Hindi ko iisiping 'Hindi ko kaya.' Maglalaan ako ng regular na panahon para hanapin si Jehova sa Bibliya, na naniniwalang magpapakilala Siya kung tapat ako.",en_quick:"1 Chron 28:9 proves Jehovah wants to be found.",tl_quick:"Pinatutunayan ng 1 Cro. 28:9 na gustong magpakilala ni Jehova."},{n:"3",q:"What will we discuss in this article?",tl_q:"Ano ang tatalakayin natin sa artikulong ito?",en_main:"The paragraph says we will discuss what it really means to know Jehovah, why we should keep wanting to know Him better, and three ways how to do it, based on John 17:3.",tl_main:"Sinasabi sa parapo na tatalakayin natin kung ano talaga ang ibig sabihin ng pagkilala kay Jehova, bakit dapat pa rin tayong magnasang makilala Siya nang lubusan, at tatlong paraan kung paano ito gagawin, batay sa Juan 17:3.",en_add1:"It teaches that our relationship with Jehovah should grow, not stay at baptism level. The article will give us a clear direction.",tl_add1:"Itinuturo nito na dapat lumago ang kaugnayan natin kay Jehova, hindi manatili sa level ng bautismo. Bibigyan tayo ng malinaw na direksiyon ng artikulo.",en_add2:"I will keep a notebook and write 'What did this teach me about Jehovah?' after each study, to focus on the three points discussed.",tl_add2:"Magsusulat ako sa notebook ng 'Ano ang natutunan ko tungkol kay Jehova?' pagkatapos ng bawat pag-aaral, para mag-focus sa tatlong punto.",en_quick:"What knowing Jehovah means, why keep wanting, and how.",tl_quick:"Kung ano ang pagkilala kay Jehova, bakit patuloy na magnasa, at paano."},{n:"4",q:"What is included in knowing Jehovah?",tl_q:"Ano ang kasama sa pagkilala kay Jehova?",en_main:"The paragraph explains that knowing Jehovah is more than facts. It includes knowing His name, purposes, qualities like justice and love, and what pleases or displeases Him. Jeremiah shows Josiah knew Jehovah because he practiced justice.",tl_main:"Ipinaliliwanag sa parapo na ang pagkilala kay Jehova ay higit pa sa impormasyon. Kasama rito ang pag-alam sa pangalan Niya, layunin, katangian tulad ng katarungan at pag-ibig, at kung ano ang nakalulugod o hindi sa Kanya. Ipinakita ni Josias na kilala niya si Jehova dahil nagsagawa siya ng katarungan.",en_add1:"It teaches that real knowledge changes how we live. If we say we know Jehovah but live like we don't, we don't really know Him, as Jeremiah 22:16 shows.",tl_add1:"Itinuturo nito na binabago ng tunay na kaalaman ang pamumuhay natin. Kung sinasabi nating kilala natin si Jehova pero iba ang pamumuhay, hindi talaga natin Siya kilala, gaya ng Jeremias 22:16.",en_add2:"I will check my decisions: Does this reflect that I know Jehovah hates injustice? At work, at home, I will show I know Him by doing what is right.",tl_add2:"Susuriin ko ang mga desisyon ko: Nagpapakita ba ito na alam kong galit si Jehova sa kawalang-katarungan? Sa trabaho at bahay, ipapakita kong kilala ko Siya sa pamamagitan ng paggawa ng tama.",en_quick:"Knowing Jehovah includes knowing what pleases Him and doing it.",tl_quick:"Kasama sa pagkilala kay Jehova ang pag-alam kung ano ang nakalulugod sa Kanya at paggawa nito."},{n:"5",q:"What can we learn from King Josiah about knowing Jehovah?",tl_q:"Ano ang matututuhan natin kay Haring Josias pagdating sa pagkilala kay Jehova?",en_main:"The paragraph about 2 Chronicles 34:3 says Josiah started seeking Jehovah at age 16, even though his father and grandfather were bad. He didn't let bad family example stop him.",tl_main:"Sinasabi sa parapo tungkol sa 2 Cronica 34:3 na nagsimulang hanapin ni Josias si Jehova noong 16 anyos siya, kahit masama ang ama at lolo niya. Hindi niya hinayaang mapigilan siya ng masamang halimbawa ng pamilya.",en_add1:"It teaches that our family background does not decide our friendship with Jehovah. Even if we grew up with no truth, we can personally seek Him like Josiah.",tl_add1:"Itinuturo nito na hindi ang pamilya ang magpapasya sa pakikipagkaibigan natin kay Jehova. Kahit lumaki tayong walang katotohanan, maaari tayong personal na hanapin Siya tulad ni Josias.",en_add2:"I will imitate Josiah by starting now, regardless of my past. If young, I will not say 'bata pa ako.' I will seek Jehovah in prayer and study like Josiah.",tl_add2:"Tutularan ko si Josias sa pamamagitan ng pagsisimula ngayon, anuman ang nakaraan ko. Kung bata pa, hindi ko sasabihing 'bata pa ako.' Hahanapin ko si Jehova sa panalangin at pag-aaral tulad ni Josias.",en_quick:"Josiah sought Jehovah young despite bad family.",tl_quick:"Hinahanap ni Josias si Jehova kahit bata at masama ang pamilya."},{n:"6",q:"As shown in Psalm 9:10, what effect does knowing Jehovah better have on us?",tl_q:"Gaya ng ipinapakita sa Awit 9:10, ano ang epekto sa atin kapag mas nakilala natin si Jehova?",en_main:"Psalm 9:10 says those who know Your name will trust in You. The paragraph says the more we know Jehovah's name and personality, the more we trust Him in trials.",tl_main:"Sinasabi ng Awit 9:10 na ang mga nakakakilala sa pangalan Mo ay magtitiwala sa Iyo. Sinasabi sa parapo na habang mas nakikilala natin ang pangalan at personalidad ni Jehova, mas nagtitiwala tayo sa Kanya sa mga pagsubok.",en_add1:"It teaches that trust is not automatic; it grows with knowledge. If we struggle with anxiety, we need more knowledge of Jehovah's name, not just more willpower.",tl_add1:"Itinuturo nito na hindi automatic ang tiwala; lumalago ito kasama ng kaalaman. Kung may anxiety tayo, kailangan natin ng mas maraming kaalaman tungkol sa pangalan ni Jehova, hindi lang lakas ng loob.",en_add2:"When I feel anxious, I will recall one specific thing I learned about Jehovah's name this week and pray using His name, building trust as Psalm 9:10 says.",tl_add2:"Kapag nababalisa ako, aalalahanin ko ang isang partikular na natutunan ko tungkol sa pangalan ni Jehova ngayong linggo at mananalangin gamit ang pangalan Niya, para tumibay ang tiwala gaya ng Awit 9:10.",en_quick:"Knowing His name builds trust.",tl_quick:"Ang pagkilala sa pangalan Niya ay nagpapatibay ng tiwala."},{n:"7",q:"What may happen when we have been serving Jehovah for a long time?",tl_q:"Ano ang posibleng mangyari kapag matagal na tayong naglilingkod kay Jehova?",en_main:"The paragraph warns based on 2 Timothy 3 that we may slowly lose our appreciation if we become routine. We may read Bible quickly without meditating.",tl_main:"Nagbababala ang parapo batay sa 2 Timoteo 3 na posibleng unti-unting mawala ang pagpapahalaga natin kung maging routine na lang. Maaaring mabilis na lang tayong magbasa ng Bibliya nang hindi nagbubulay-bulay.",en_add1:"It teaches that length of service does not protect us from spiritual drowsiness. We must guard our first love.",tl_add1:"Itinuturo nito na hindi garantiya ang tagal ng paglilingkod laban sa espirituwal na pagkaantok. Dapat nating bantayan ang unang pag-ibig natin.",en_add2:"I will avoid routine by asking new questions when I read familiar accounts: 'What does this show about Jehovah that I didn't notice before?'",tl_add2:"Iiwasan ko ang routine sa pamamagitan ng pagtatanong ng bago kapag nagbabasa ng pamilyar na ulat: 'Ano ang ipinapakita nito tungkol kay Jehova na hindi ko napansin dati?'",en_quick:"Long service can become routine if not careful.",tl_quick:"Ang matagal na paglilingkod ay puwedeng maging routine kung hindi mag-iingat."},{n:"8",q:"Why should we keep studying God's Word deeply?",tl_q:"Kapag mas nakilala natin si Jehova, ano ang magiging epekto nito sa kaugnayan natin sa kaniya?",en_main:"The paragraph says the Bible is like a personal letter from Jehovah. To know Him better, we need to read slowly, meditate, and picture the setting, not just finish chapters.",tl_main:"Sinasabi sa parapo na ang Bibliya ay parang personal na liham mula kay Jehova. Para mas makilala Siya, kailangan nating magbasa nang mabagal, magbulay-bulay, at isalarawan ang tagpo, hindi lang matapos ang mga kabanata.",en_add1:"It teaches that Bible reading is relationship building, not just information gathering. Quality matters more than quantity.",tl_add1:"Itinuturo nito na ang pagbabasa ng Bibliya ay pakikipagrelasyon, hindi lang pangangalap ng impormasyon. Mas mahalaga ang kalidad kaysa dami.",en_add2:"I will use the 'Enjoy Life Forever' suggestion: before reading, pray 'Jehovah, help me see You here,' and after, write one quality I saw.",tl_add2:"Gagamitin ko ang mungkahi ng 'Masayang Buhay': bago magbasa, manalangin ng 'Jehova, tulungan mo akong makita Ka dito,' at pagkatapos, isulat ang isang katangiang nakita ko.",en_quick:"Bible is Jehovah's letter; read to know Him.",tl_quick:"Ang Bibliya ay liham ni Jehova; basahin para makilala Siya."},{n:"9",q:"What can we learn about Jehovah from Jeremiah?",tl_q:"Kung isinasaisip natin si Jehova, ano ang magiging epekto nito sa mga desisyon natin?",en_main:"The paragraph on Jeremiah says Jehovah patiently trained Jeremiah, gave him courage despite opposition, and showed in Jeremiah 38 that He rescues those who trust Him like Ebed-melech.",tl_main:"Sinasabi sa parapo tungkol kay Jeremias na matiyagang sinanay ni Jehova si Jeremias, binigyan ng lakas ng loob sa kabila ng pagtutol, at ipinakita sa Jeremias 38 na inililigtas Niya ang mga nagtitiwala sa Kanya tulad ni Ebed-melec.",en_add1:"It teaches that Jehovah is patient with us when we feel inadequate. He doesn't expect perfect courage immediately; He builds it.",tl_add1:"Itinuturo nito na matiyaga si Jehova kapag nadarama nating hindi tayo sapat. Hindi Niya inaasahang perpekto agad ang tapang natin; pinatitibay Niya ito.",en_add2:"If I feel like Jeremiah - shy or afraid to speak - I will remember Jehovah trained him gradually and will train me too through small assignments.",tl_add2:"Kung pakiramdam ko ay tulad ni Jeremias — mahiyain o natatakot magsalita — aalalahanin kong unti-unting sinanay siya ni Jehova at sasanayin din Niya ako sa maliliit na atas.",en_quick:"Jehovah patiently trains and rescues.",tl_quick:"Matiyagang sinasanay at inililigtas ni Jehova."},{n:"10",q:"Why should we keep studying God's Word deeply?",tl_q:"Kapag mas nakilala natin si Jehova, ano ang magagawa natin?",en_main:"The paragraph says the Bible is like a personal letter from Jehovah. To know Him better, we need to read slowly, meditate, and picture the setting, not just finish chapters.",tl_main:"Sinasabi sa parapo na ang Bibliya ay parang personal na liham mula kay Jehova. Para mas makilala Siya, kailangan nating magbasa nang mabagal, magbulay-bulay, at isalarawan ang tagpo, hindi lang matapos ang mga kabanata.",en_add1:"It teaches that Bible reading is relationship building, not just information gathering. Quality matters more than quantity.",tl_add1:"Itinuturo nito na ang pagbabasa ng Bibliya ay pakikipagrelasyon, hindi lang pangangalap ng impormasyon. Mas mahalaga ang kalidad kaysa dami.",en_add2:"I will use the 'Enjoy Life Forever' suggestion: before reading, pray 'Jehovah, help me see You here,' and after, write one quality I saw.",tl_add2:"Gagamitin ko ang mungkahi ng 'Masayang Buhay': bago magbasa, manalangin ng 'Jehova, tulungan mo akong makita Ka dito,' at pagkatapos, isulat ang isang katangiang nakita ko.",en_quick:"Bible is Jehovah's letter; read to know Him.",tl_quick:"Ang Bibliya ay liham ni Jehova; basahin para makilala Siya."},{n:"11",q:"What helped Mary, Jesus' mother, to get to know Jehovah better?",tl_q:"Paano mo unang nakilala si Jehova?",en_main:"The paragraph on Luke says Mary kept pondering Jehovah's words in her heart. After receiving assignment to be Jesus' mother in Luke 1, she meditated on Scriptures and sang praises about Jehovah's mercy.",tl_main:"Sinasabi ng parapo tungkol kay Lucas na patuloy na pinagbulay-bulayan ni Maria ang mga salita ni Jehova sa puso niya. Pagkatapos matanggap ang atas na maging ina ni Jesus sa Lucas 1, nagbulay-bulay siya sa Kasulatan at umawit ng papuri tungkol sa awa ni Jehova.",en_add1:"It teaches that meditating and singing about Jehovah helps us remember what we learn. Mary didn't just hear; she kept it in her heart.",tl_add1:"Itinuturo nito na ang pagbubulay-bulay at pag-awit tungkol kay Jehova ay nakakatulong para maalala ang natututuhan. Hindi lang narinig ni Maria; iningatan niya sa puso.",en_add2:"I will imitate Mary by keeping a 'heart journal' - after meeting, write one verse about Jehovah's mercy I can sing or recall during the week.",tl_add2:"Tutularan ko si Maria sa pamamagitan ng pag-iingat ng 'journal ng puso' — pagkatapos ng pulong, isulat ang isang talata tungkol sa awa ni Jehova na maaari kong awitin o alalahanin sa linggo.",en_quick:"Mary pondered Jehovah's words in her heart.",tl_quick:"Pinagbulay-bulayan ni Maria ang mga salita ni Jehova sa puso."},{n:"12-13",q:"Why can we never run out of things to learn about Jehovah?",tl_q:"Ano ang puwede nating matutuhan tungkol kay Jehova kapag nagbabasa ng Bibliya?",en_main:"The paragraph says Revelation 20:12 shows scrolls will be opened for 1000 years, and Psalm 90:2, 147:5 say Jehovah is infinite and eternal. Even eternity is not enough to learn all.",tl_main:"Sinasabi sa parapo na ipinapakita ng Apocalipsis 20:12 na bubuksan ang mga balumbon sa loob ng 1000 taon, at sinasabi ng Awit 90:2, 147:5 na si Jehova ay walang hanggan at walang sukat. Kahit ang kawalang-hanggan ay hindi sapat para matutunan ang lahat.",en_add1:"It teaches that eternal life will never be boring because Jehovah is an endless subject. Our friendship can always deepen.",tl_add1:"Itinuturo nito na hindi kailanman magiging boring ang buhay na walang hanggan dahil si Jehova ay walang katapusang paksa. Ang pakikipagkaibigan natin ay puwedeng laging lumalim.",en_add2:"I will not think 'alam ko na yan.' Instead, I will be excited that after 10, 20, 1000 years, there will still be new things to learn about Jehovah.",tl_add2:"Hindi ko iisiping 'alam ko na yan.' Sa halip, masisiyahan ako na pagkatapos ng 10, 20, 1000 taon, may bago pa ring matututuhan tungkol kay Jehova.",en_quick:"Jehovah is infinite; learning never ends.",tl_quick:"Walang hanggan si Jehova; walang katapusan ang pagkatuto."},{n:"14",q:"How can we show we really know Jehovah in daily decisions?",tl_q:"Bakit dapat nating pag-isipang mabuti ang mga nilalang ni Jehova?",en_main:"The paragraph says Matthew 23:23 shows knowing Jehovah means practicing justice, mercy, and faithfulness even in small matters, not just big ones.",tl_main:"Sinasabi sa parapo na ipinapakita ng Mateo 23:23 na ang pagkilala kay Jehova ay nangangahulugang pagsasagawa ng katarungan, awa, at katapatan kahit sa maliliit na bagay, hindi lang sa malalaki.",en_add1:"It teaches that Jehovah notices small decisions. Daily faithfulness proves real knowledge.",tl_add1:"Itinuturo nito na napapansin ni Jehova ang maliliit na desisyon. Ang pang-araw-araw na katapatan ay nagpapatunay ng tunay na kaalaman.",en_add2:"At work, I will choose honesty even in small reports, showing I know Jehovah loves righteousness.",tl_add2:"Sa trabaho, pipiliin ko ang katapatan kahit sa maliliit na report, na nagpapakitang alam kong mahal ni Jehova ang katuwiran.",en_quick:"Daily small decisions prove we know Jehovah.",tl_quick:"Ang maliliit na desisyon araw-araw ay nagpapatunay na kilala natin si Jehova."},{n:"15",q:"How does knowing Jehovah help us endure anxiety?",tl_q:"Ano ang ginawa ni Patrick para mas makilala si Jehova, at paano mo rin magagawa iyan?",en_main:"The paragraph shows a brother with anxiety who remembered that Jehovah knows our frame and invites us to approach His throne of undeserved kindness in Hebrews 4:16.",tl_main:"Ipinapakita ng parapo ang isang brother na may anxiety na naalala na alam ni Jehova ang kaanyuan natin at inaanyayahan tayong lumapit sa trono ng Kanyang di-sana-nararapat na kabaitan sa Hebreo 4:16.",en_add1:"It teaches that knowing Jehovah's empathy helps more than just coping techniques. He understands anxiety.",tl_add1:"Itinuturo nito na ang pag-alam sa empatiya ni Jehova ay mas nakakatulong kaysa sa teknik lang. Naiintindihan Niya ang anxiety.",en_add2:"When anxious, I will pray specifically: 'Jehovah, You know my frame, help me feel Your throne is open for me today.'",tl_add2:"Kapag nababalisa, mananalangin ako nang partikular: 'Jehova, alam Mo ang kaanyuan ko, tulungan Mo akong madama na bukas ang trono Mo para sa akin ngayon.'",en_quick:"Jehovah understands our anxiety; His throne is open.",tl_quick:"Naiintindihan ni Jehova ang anxiety natin; bukas ang trono Niya."},{n:"16",q:"What should we be determined to do?",tl_q:"Ano ang nakatulong sa ina ni Jesus na si Maria para mas makilala si Jehova, at paano natin siya matutularan?",en_main:"The final paragraph summarizes: Be determined to keep getting to know Jehovah better forever, using the Bible, creation, and personal experiences, as Psalm 90 says.",tl_main:"Binubuod ng huling parapo: Maging determinado na patuloy na makilala si Jehova nang mas lubusan magpakailanman, gamit ang Bibliya, paglalang, at personal na karanasan, gaya ng Awit 90.",en_add1:"It teaches that determination is needed; friendship with Jehovah won't grow by accident.",tl_add1:"Itinuturo nito na kailangan ng determinasyon; hindi lalago ang pakikipagkaibigan kay Jehova nang kusa.",en_add2:"I will make a specific plan: 10 minutes daily to ask 'What did I learn about Jehovah today?' and share it with someone.",tl_add2:"Gagawa ako ng tiyak na plano: 10 minuto araw-araw para itanong 'Ano ang natutunan ko tungkol kay Jehova ngayon?' at ibahagi ito sa iba.",en_quick:"Determined to keep knowing Jehovah forever.",tl_quick:"Determinadong patuloy na makilala si Jehova magpakailanman."},{n:"17-18",q:"What proves that we can get to know Jehovah?",tl_q:"Bakit natin nasabi na hindi tayo mauubusan ng matututuhan tungkol kay Jehova?",en_main:"The paragraph cites 1 Chronicles 28:9 - if we search for Him, He will let Himself be found. Also 1 John 5:20 says Jesus came to give us insight. So Jehovah Himself invites us to know Him.",tl_main:"Binanggit sa parapo ang 1 Cronica 28:9 — kung hahanapin natin Siya, ipapakilala Niya ang sarili Niya. Sinasabi rin ng 1 Juan 5:20 na dumating si Jesus para bigyan tayo ng kaunawaan. Kaya si Jehova mismo ang nag-aanyaya na makilala Siya.",en_add1:"It teaches that knowing Jehovah is not impossible or only for scholars. He wants even ordinary people to know Him, which shows His love and accessibility.",tl_add1:"Itinuturo nito na ang pagkilala kay Jehova ay hindi imposible o para lang sa matatalino. Gusto Niyang makilala Siya kahit ng mga karaniwang tao, na nagpapakita ng pag-ibig at pagiging lapitin Niya.",en_add2:"I will not think 'Hindi ko kaya.' I will regularly set time to search for Jehovah in the Bible, believing He will let Himself be found if I am sincere.",tl_add2:"Hindi ko iisiping 'Hindi ko kaya.' Maglalaan ako ng regular na panahon para hanapin si Jehova sa Bibliya, na naniniwalang magpapakilala Siya kung tapat ako.",en_quick:"1 Chron 28:9 proves Jehovah wants to be found.",tl_quick:"Pinatutunayan ng 1 Cro. 28:9 na gustong magpakilala ni Jehova."}],cong:[{n:"For Discussion",q:"In what ways did the midwives and Moses’ family show courage?",en_main:"Shiphrah and Puah showed courage by obeying Jehovah rather than Pharaoh, even though the order came from Egypt’s most powerful man. Amram and Jochebed risked much to protect their son, and Miriam acted with initiative when she watched the basket and spoke to Pharaoh’s daughter. I learn that courage is not always dramatic; often it means doing what is right when obedience to God carries a real cost.",en_add1:"Hebrews 11:23 highlights the faith of Moses’ parents. They did not act because they knew exactly how it would end, but because they were convinced about who deserved their obedience. That teaches me Christian courage can appear before there is a visible solution.",en_add2:"Miriam was young, but not a passive observer. She stayed alert, saw an opportunity, and spoke at the right moment. Her example encourages me not to think age or lack of responsibility prevents me from doing something courageous and useful.",en_quick:"Their courage came from putting Jehovah above fear, even when the outcome was still uncertain.",tl_main:"Ipinakita po nina Sifra at Pua ang tapang sa pamamagitan po ng pagsunod kay Jehova kaysa kay Paraon, kahit galing pa po ang utos sa pinakamaktapang na tao sa Ehipto. Sina Amram at Jokebed naman, handa pong isugal ang lahat para protektahan ang anak nila, at si Miriam, kumilos nang may kusa — binantayan ang basket at kinausap ang anak na babae ni Paraon. Natututuhan ko na ang tapang, hindi laging dramatic; madalas, ibig sabihin lang nito ay gawin ang tama kahit may kapalit ang pagsunod sa Diyos.",tl_add1:"Binibigyang-diin po ng Hebreo 11:23 ang pananampalataya po ng mga magulang ni Moises. Hindi po sila kumilos dahil alam na nila kung paano matatapos, kundi dahil kumbinsido sila kung sino ang dapat sundin. Kaya natututuhan ko na ang kristiyanong tapang, puwede pong lumitaw kahit wala pa pong nakikitang solusyon.",tl_add2:"Bata pa po si Miriam, pero hindi po siya passive na tagamasid lang. Alerto po siya, nakakita ng opportunity, at nagsalita sa tamang sandali. Nakaka-encourage ito na huwag isipin na dahil bata o walang tungkulin, hindi na puwedeng gumawa ng matapang at kapaki-pakinabang para sa iba.",tl_quick:"Po, ang tapang nila ay galing sa paglalagay kay Jehova na mas mataas kaysa sa takot, kahit hindi pa po sigurado ang kahihinatnan.",tl_q:"Paano nagpakita ng lakas ng loob ang mga komadrona at ang pamilya ni Moises?"},{n:"1",q:"What does archaeology reveal as to the accuracy of this account?",en_main:"Archaeology provides details that fit the Egyptian setting described in the Bible and the presence of Semitic peoples in that region. Such evidence does not replace faith, but it confirms Bible accounts are rooted in real places, customs, and periods. The Bible does not present a vague myth but events that fit what is known about the ancient world.",en_add1:"It also helps me stay balanced: I do not need every detail to have a matching artifact. Surviving evidence is incomplete. When independent findings fit the historical setting, I view them as additional reason to respect the accuracy of the account.",en_add2:"This research can help when speaking with someone who thinks the Bible is merely legends. Rather than argue, I can show its accounts take place in recognizable historical settings and invite the person to examine evidence personally.",en_quick:"Archaeology does not create my faith, but it can reinforce my confidence that the Bible records real history.",tl_main:"Nagbibigay po ang arkeolohiya ng mga detalye na tugma po sa setting ng Ehipto na inilalarawan po ng Bibliya at sa presensya ng mga Semitikong tao sa lugar na yun. Hindi nito pinapalitan ang pananampalataya, pero kinukumpirma nito na ang mga salaysay ng Bibliya ay nakaugat sa totoong lugar, kaugalian, at panahon. Hindi malabong alamat ang Bibliya kundi mga pangyayari na tugma sa alam natin tungkol sa sinaunang mundo.",tl_add1:"Nakatutulong din po ito para manatiling balanse: hindi ko po kailangang may artifact para sa bawat detalye. Kulang po kasi ang mga ebidensyang natira. Pero kapag ang independent findings ay tugma sa historical setting, tinitingnan ko ito bilang dagdag na dahilan para igalang ang pagiging tumpak ng salaysay.",tl_add2:"Makatutulong po ang research na ito kapag may kausap po akong nag-aakala na alamat lang ang Bibliya. Sa halip na makipagtalo, puwede ko pong ipakita na ang mga salaysay nito ay nangyari po sa makikilalang historical setting at anyayahan siyang personal na suriin ang ebidensya.",tl_quick:"Po, hindi po lumilikha ng pananampalataya ko ang arkeolohiya, pero pinalalakas po nito ang kumpiyansa ko na totoong kasaysayan ang naka-record sa Bibliya.",tl_q:"Anong mga ebidensiya sa arkeolohiya ang nagpapakita na tumira noon ang mga Israelita sa Ehipto? (g04 4/8 4 ¶14-5 ¶1)"},{n:"2",q:"What supports the Bible’s record of a papyrus basket and of Pharaoh’s order to kill the Hebrew babies?",en_main:"Papyrus was commonly used in Egypt to make containers and boats, so Moses’ basket fits naturally with that culture. Pharaoh’s absolute authority also explains how he could issue cruel orders against a subject people. These details show the account knows its environment well. Accuracy of everyday elements makes story more tangible as event in real society.",en_add1:"I am struck that Jochebed used available materials and practical skill to protect her child. Faith did not make her wait passively for a miracle. She did what she could with ordinary resources and left outcome with Jehovah; that blend of faith and initiative is useful today.",en_add2:"The account also shows how a government can turn unjust decision into official policy. That reminds me human legality and divine justice do not always coincide. When they conflict, I need to decide in advance that Jehovah’s authority comes first.",en_quick:"The Egyptian details make the account more vivid and highlight the practical faith shown by Moses’ family.",tl_main:"Karaniwan na pong ginagamit sa Ehipto ang papiro para gumawa ng lalagyan at bangka, kaya bagay na bagay po sa kultura nila yung basket po ni Moises. Yung absolute authority po ni Paraon, nagpapaliwanag din kung paano siya nakapaglabas ng malulupit na utos laban sa nasasakupan. Makikita na kabisado ng salaysay ang environment nito. Dahil tumpak ang mga pang-araw-araw na detalye, mas nagiging totoo ang kwento bilang pangyayari sa totoong lipunan.",tl_add1:"Tumatak po sa akin na ginamit po ni Jokebed ang available na materyales at praktikal na skill para protektahan po ang anak niya. Hindi siya naghintay lang nang passive para sa himala ang pananampalataya niya. Ginawa niya ang kaya niya gamit ang ordinaryong resources at iniwan kay Jehova ang kahihinatnan; yung blend ng pananampalataya at pagkukusa, magagamit natin ngayon.",tl_add2:"Ipinapakita rin po ng salaysay kung paano puwedeng gawing opisyal na polisiya ng gobyerno ang di-makatarungang desisyon. Paalala po ito na hindi po laging magkatugma ang human legality at divine justice. Kapag nagkasalungat, kailangan ko pong desisyunan na noon pa lang na mas una ang awtoridad ni Jehova.",tl_quick:"Po, mas nagiging vivid ang salaysay dahil sa Egyptian details at na-highlight po yung praktikal na pananampalataya ng pamilya ni Moises.",tl_q:"Paano natin nalaman na tama ang sinasabi ng Bibliya tungkol sa paggamit ng basket na papiro at tungkol sa utos ni Paraon na patayin ang mga sanggol na Hebreo? (g04 4/8 6 ¶1, 2) Larawan A"},{n:"3",q:"What do we know about the Hebrew midwives, and how were they blessed?",en_main:"Shiphrah and Puah feared the true God, and that healthy fear outweighed fear of Pharaoh. They chose to preserve innocent life even though they knew they could be questioned for disobedience. Jehovah saw their loyalty and dealt well with them. I learn he notices decisions others may overlook and values those who protect what is right when it requires courage.",en_add1:"Their work placed them exactly where Pharaoh’s order was supposed to be carried out. They could have reasoned they were merely following instructions, but they understood moral responsibility remained personal. That reminds me I can never hand my conscience over to human authority or group pressure.",en_add2:"Jehovah’s blessing did not mean situation was easy from start. They first had to act in faith. That corrects idea that God-approved decision will always remove risk immediately; sometimes his approval becomes evident after we take courageous step.",en_quick:"Shiphrah and Puah teach me that fear of Jehovah can be stronger than fear of any human.",tl_main:"May takot po sa tunay na Diyos sina Sifra at Pua, at yung malusog na takot na yun po ang mas nangibabaw kaysa takot kay Paraon. Pinili po nilang iligtas ang inosenteng buhay kahit alam nilang puwede silang kwestyunin sa pagsuway. Nakita ni Jehova ang katapatan nila at pinagpala niya sila nang maayos. Natututuhan ko na napapansin niya ang mga desisyong puwedeng hindi mapansin ng iba at pinahahalagahan niya yung mga nagtatanggol sa tama kapag kailangan ng tapang.",tl_add1:"Yung trabaho po nila mismo ang naglagay sa kanila kung saan dapat ipatupad ang utos ni Paraon. Puwede po nilang idahilan na sumusunod lang sila sa utos, pero naintindihan po nila na personal pa rin ang moral responsibility. Paalala ito sa akin na hindi ko puwedeng ipasa ang konsensya ko sa human authority o sa pressure ng grupo.",tl_add2:"Hindi po ibig sabihin na naging madali agad ang sitwasyon dahil pinagpala sila ni Jehova. Kailangan po muna nilang kumilos nang may pananampalataya. Itinatama po nito yung ideya na kapag aprubado ng Diyos ang desisyon, aalisin agad ang risk; minsan, pagkatapos na ng matapang na hakbang saka pa lang nakikita ang pagsang-ayon niya.",tl_quick:"Po, itinuturo po nina Sifra at Pua na puwedeng mas malakas ang takot kay Jehova kaysa takot sa sinumang tao.",tl_q:"Ano ang alam natin tungkol sa mga komadronang Hebreo? Paano sila pinagpala ni Jehova? (Tingnan ang “Komentaryo,” w03 11/1 9 ¶8-9) Larawan B"},{n:"4",q:"How did Miriam show outstanding faith well into old age?",en_main:"Miriam kept serving Jehovah for decades after scene by the Nile. She lived through enormous changes, saw people leave Egypt, and remained active among Israelites. Although she also made mistakes, her whole life shows faith that was not frozen in one childhood act. I am encouraged that true courage is not a single moment; it can become lifelong course of service.",en_add1:"Her example also shows later mistake does not automatically erase years of faithfulness. Jehovah corrected Miriam when necessary, yet Bible still recognizes her place among his servants. That helps me accept correction without thinking one failure defines entire spiritual life.",en_add2:"I would like to imitate her endurance by remaining useful as strength and circumstances change. With age I may not be able to do exactly what I once did, but I can keep looking for ways to support true worship and encourage those who come after.",en_quick:"Miriam encourages me to turn courage in one moment into a whole life of faithful service.",tl_main:"Patuloy po si Miriam na naglingkod kay Jehova nang dekada pagkatapos po ng eksena sa Ilog Nilo. Naranasan po niya ang napakalaking pagbabago, nakita niyang umalis ang bayan sa Ehipto, at nanatili pa rin pong aktibo sa mga Israelita. Kahit nagkamali rin siya, ang buong buhay niya ay nagpapakita na hindi lang na-freeze sa isang childhood act ang pananampalataya. Nakaka-encourage na ang tunay na tapang ay hindi lang isang sandali; puwede itong maging habambuhay na paglilingkod.",tl_add1:"Ipinapakita rin po ng halimbawa niya na hindi po awtomatikong binubura ng huling pagkakamali ang maraming taon ng katapatan. Itinuwid po ni Jehova si Miriam nang kinakailangan, pero kinikilala pa rin ng Bibliya ang lugar niya sa mga lingkod niya. Nakatutulong ito para tanggapin ko ang pagtutuwid nang hindi iniisip na isang pagkakamali lang ang magde-define sa buong espirituwal na buhay ko.",tl_add2:"Gusto ko pong tularan ang pagtitiis niya sa pananatiling kapaki-pakinabang kahit nagbabago na po ang lakas at kalagayan. Habang tumatanda po, baka hindi ko na po magawa yung dati kong ginagawa, pero puwede pa rin akong maghanap ng paraan para suportahan ang tunay na pagsamba at palakasin ang loob ng mga sumusunod sa akin.",tl_quick:"Po, na-e-encourage po ako ni Miriam na gawing habambuhay na tapat na paglilingkod yung tapang sa isang sandali lang.",tl_q:"Paano nagpakita si Miriam ng matibay na pananampalataya kahit noong matanda na siya? (tingnan artikulo 7 ¶14-16)"},{n:"5",q:"What can parents learn from Amram and Jochebed?",en_main:"Amram and Jochebed did everything they could to protect their children and used time they had with Moses to teach him about Jehovah. Their example shows parents cannot control every outside circumstance, but they can create a home where faith becomes real. Spiritual teaching requires intention, time, and example. What a child learns early about Jehovah can stay with him long after he leaves home.",en_add1:"They also had to accept that time would come when they could no longer protect Moses personally. That must have been painful. Christian parents can prepare children for future choices by teaching not only what to do but why they love Jehovah and trust his standards.",en_add2:"Their family shows spirituality does not depend on ideal conditions. They raised faithful children under slavery and threat. That can encourage parents facing financial pressure, opposition, or limited time: hardship does not prevent consistent example from leaving deep mark.",en_quick:"Parents cannot control everything, but they can fill the home with reasons to love and trust Jehovah.",tl_main:"Ginawa po nina Amram at Jokebed ang lahat ng kaya nila para protektahan po ang mga anak at ginamit po nila yung panahong kasama nila si Moises para turuan siya tungkol kay Jehova. Ipinapakita ng halimbawa nila na hindi makokontrol ng magulang ang lahat ng pangyayari sa labas, pero puwede silang lumikha ng tahanan kung saan nagiging totoo ang pananampalataya. Ang espirituwal na pagtuturo, nangangailangan ng intensyon, oras, at halimbawa. Yung natutuhan ng bata nang maaga tungkol kay Jehova, puwede pong manatili sa kaniya kahit matagal na siyang wala sa bahay.",tl_add1:"Kinailangan din po nilang tanggapin na darating po ang panahon na hindi na po nila mapoprotektahan nang personal si Moises. Masakit yun sigurado. Puwede pong ihanda ng kristiyanong mga magulang ang mga anak sa mga desisyon sa hinaharap sa pamamagitan ng pagtuturo hindi lang kung ano ang gagawin, kundi kung bakit nila mahal si Jehova at nagtitiwala sa mga pamantayan niya.",tl_add2:"Ipinapakita po ng pamilya nila na hindi po nakadepende sa ideal na kondisyon ang pagiging espirituwal. Pinalaki po nila ang mga anak na tapat kahit nasa pagkaalipin at nasa banta. Puwede pong ma-encourage ang mga magulang na may pinansyal na pressure, oposisyon, o kulang sa oras: hindi hadlang ang hirap para makapag-iwan ng malalim na marka ang consistent na halimbawa.",tl_quick:"Po, hindi po makokontrol ng magulang ang lahat, pero puwede po nilang punuin ang tahanan ng mga dahilan para mahalin at pagtiwalaan si Jehova.",tl_q:"Ano ang matututunan ng mga magulang kina Amram at Jochebed?"},{n:"6",q:"What can siblings learn from young Miriam?",en_main:"Miriam showed that an older sibling can watch over and help younger one without acting superior. She stayed attentive to Moses and used initiative when opportunity to help appeared. Children can imitate her by being protective, speaking kindly, and supporting siblings spiritually. Good relationship between brothers and sisters can become source of encouragement for many years.",en_add1:"Miriam did not solve entire problem, but she did part within her reach. That is beautiful lesson for a child: you do not have to be adult to help. You can include sibling, defend them from teasing, share something learned from Bible, or give encouragement when they are sad.",en_add2:"I also learn that being observant matters. Miriam could act because she was watching. In a family, noticing that sibling is quiet, nervous, or needs help can open door to simple act that strengthens relationship and makes that person feel supported.",en_quick:"Miriam teaches me that a sibling can be protective, attentive, and spiritually helpful from a young age.",tl_main:"Ipinakita po ni Miriam na ang nakatatandang kapatid ay puwedeng magbantay at tumulong sa nakababata nang hindi po nagmamataas. Naging alerto po siya kay Moises at nagkusa nang may opportunity na tumulong. Matutularan siya ng mga bata sa pamamagitan ng pagiging mapagprotekta, magalang na pananalita, at pagsuporta sa kapatid sa espirituwal. Yung magandang relasyon ng magkakapatid, puwede pong maging source ng encouragement nang maraming taon.",tl_add1:"Hindi po nalutas ni Miriam ang buong problema, pero ginawa po niya yung parte na kaya niya. Magandang aral po ito sa bata: hindi mo kailangang maging adult para makatulong. Puwede mo pong isama ang kapatid, ipagtanggol sa tukso, ibahagi ang natutuhan sa Bibliya, o palakasin ang loob kapag malungkot siya.",tl_add2:"Natututuhan ko rin po na mahalaga ang pagiging observant. Nakakilos po si Miriam kasi nagmamasid po siya. Sa pamilya, kapag napansin na tahimik, kinakabahan, o nangangailangan ng tulong ang kapatid, puwede pong magbukas ito ng pinto para sa simpleng gawa na magpapatibay ng relasyon at maramdaman niyang suportado siya.",tl_quick:"Po, itinuturo po ni Miriam na ang kapatid ay puwedeng maging mapagprotekta, alerto, at tumutulong sa espirituwal kahit bata pa lang.",tl_q:"Ano ang matututunan kay Miriam ng mga batang may kapatid? Larawan C"},{n:"7",q:"How might you imitate the courage of Shiphrah and Puah in your life?",en_main:"I can imitate Shiphrah and Puah by deciding in advance that no human pressure will outrank my obedience to Jehovah. If an authority, employer, classmate, or group expects something that violates Bible principle, I need trained conscience that recognizes line. Their example also teaches calm intelligence: courage does not require seeking conflict, but it does require standing firm when choice must be made.",en_add1:"One way to prepare is to think ahead about possible situations and what I would say. If I wait until under pressure, fear may control response. Knowing Bible principle and having respectful explanation ready can help me speak firmly without becoming aggressive.",en_add2:"I also want to remember they protected others, not just own conscience. Sometimes Christian courage means using my position to keep vulnerable person from being treated unjustly. I can ask what responsible action is within my reach without compromising principles.",en_quick:"I want to train my conscience now so that under pressure, obeying Jehovah remains my first reaction.",tl_main:"Matutularan ko po sina Sifra at Pua sa pamamagitan po ng pagdedesisyon na noon pa lang na walang human pressure ang hihigit sa pagsunod ko kay Jehova. Kapag ang awtoridad, employer, kaklase, o grupo ay may inaasahang labag po sa prinsipyo ng Bibliya, kailangan ko ng sanay na konsensya na nakakakilala ng hangganan. Itinuturo rin ng halimbawa nila ang kalmadong katalinuhan: hindi kailangang hanapin ang gulo ng tapang, pero kailangan pong manindigan kapag kailangan nang pumili.",tl_add1:"Isang paraan po ng paghahanda ay pag-isipan na po nang maaga ang mga posibleng sitwasyon at kung ano po ang sasabihin ko. Kung maghihintay ako hanggang pressured na, baka takot na ang magkontrol sa response ko. Kapag alam ko ang prinsipyo at may magalang na paliwanag na handa, makakatulong para magsalita nang matatag nang hindi nagiging agresibo.",tl_add2:"Gusto ko rin pong alalahanin na pinrotektahan po nila ang iba, hindi lang po ang sariling konsensya. Minsan po, ang kristiyanong tapang ay nangangahulugang gamitin ang posisyon ko para hindi maltratuhin nang di-makatarungan ang mahina. Puwede ko pong itanong, ano ang responsableng kilos na kaya kong gawin nang hindi kinokompromiso ang prinsipyo?",tl_quick:"Po, gusto ko pong sanayin na ngayon pa lang ang konsensya ko para kapag pressured na, ang pagsunod kay Jehova pa rin po ang una kong reaksyon.",tl_q:"Paano mo matutularan ang lakas ng loob nina Sifra at Pua?"},{n:"8",q:"What does this account teach me about Jehovah?",en_main:"This account teaches me Jehovah sees acts of faith that powerful people may despise or never notice. He observed two midwives, enslaved parents, and young girl, and used their choices to protect Moses. It also shows he can frustrate cruel plans without losing control of his purpose. I am impressed by his individual attention: during national crisis, he knew specific actions of people who trusted him.",en_add1:"Jehovah also allows his servants to use initiative. He did not give Jochebed detailed instructions about basket or dictate every word Miriam should say. They acted with faith and good judgment, and he blessed their efforts. That helps me not confuse relying on Jehovah with waiting passively.",en_add2:"I also see Jehovah values life and does not share indifference of cruel rulers. Pharaoh viewed babies as political problem; Jehovah viewed them as lives worth protecting. That contrast teaches me much about tenderness and justice of his rulership.",en_quick:"Jehovah sees the faith of ordinary people and can make their courageous choices part of something much larger.",tl_main:"Itinuturo po ng salaysay na ito na nakikita po ni Jehova ang mga gawa ng pananampalataya na puwedeng hamakin o hindi man lang mapansin ng mga makapangyarihan. Naobserbahan po niya ang dalawang komadrona, ang mga magulang na alipin, at ang batang babae, at ginamit niya ang mga desisyon nila para protektahan si Moises. Ipinapakita rin nito na kaya niyang biguin ang malulupit na plano nang hindi nawawala ang kontrol sa layunin niya. Humahanga ako sa personal na atensyon niya: sa gitna ng pambansang krisis, alam niya ang eksaktong kilos ng mga nagtitiwala sa kaniya.",tl_add1:"Hinahayaan din po ni Jehova ang mga lingkod niya na magkusa. Hindi po siya nagbigay kay Jokebed ng detalyadong instructions tungkol sa basket o dinikta po bawat salitang sasabihin ni Miriam. Kumilos sila nang may pananampalataya at maayos na paghatol, at pinagpala niya ang effort nila. Nakatutulong ito para hindi ko malito ang pag-asa kay Jehova sa passive na paghihintay lang.",tl_add2:"Nakikita ko rin po na pinahahalagahan po ni Jehova ang buhay at hindi po niya katulad ang pagiging walang pakialam ng malulupit na pinuno. Tiningnan ni Paraon ang mga sanggol bilang political problem; tiningnan sila ni Jehova bilang mga buhay na dapat protektahan. Yung contrast pong yun, marami pong itinuturo tungkol sa lambing at katarungan ng pamamahala niya.",tl_quick:"Po, nakikita ni Jehova ang pananampalataya ng ordinaryong tao at puwede niyang gawing parte ng mas malaki ang matapang nilang desisyon.",tl_q:"Ano ang itinuturo ng ulat na ito tungkol kay Jehova?"},{n:"9",q:"How does the account tie in with Jehovah’s purposes?",en_main:"Moses’ protection ties directly to Jehovah’s purpose because he would become instrument used to free Israel from Egypt. That nation was connected with promises to Abraham and would eventually produce Messiah. Satan and Pharaoh could try to destroy lives, but they could not stop course of events Jehovah had determined. Account shows his purpose moves forward even under extreme opposition.",en_add1:"I am struck that Jehovah advanced worldwide promise through local decisions made by several families. That shows seemingly small people can have real place in his purpose. My faithfulness may look limited, but I never know how it may contribute to something larger Jehovah is accomplishing.",en_add2:"Issue of sovereignty is also present. Pharaoh acted as if he had absolute authority over life, but Shiphrah and Puah recognized higher Ruler. That conflict anticipates truth running through Bible: Jehovah deserves obedience above every human power.",en_quick:"Moses’ survival shows that no ruler can prevent Jehovah from moving his purpose forward.",tl_main:"Direktang konektado po sa layunin po ni Jehova ang pagprotekta kay Moises kasi siya po ang magiging instrumento para palayain ang Israel mula sa Ehipto. Yung bansang yun ay konektado sa mga pangako kay Abraham at sa huli ay magluluwal sa Mesiyas. Puwedeng subukan nina Satanas at Paraon na sirain ang buhay, pero hindi nila mapipigilan ang takbo ng mga pangyayaring itinakda ni Jehova. Ipinapakita ng salaysay na umuusad ang layunin niya kahit sa gitna ng matinding oposisyon.",tl_add1:"Tumatak po sa akin na isinulong po ni Jehova ang pang-buong-mundong pangako sa pamamagitan po ng lokal na desisyon ng ilang pamilya. Ipinapakita nito na kahit mukhang maliliit na tao, puwede pong magkaroon ng tunay na lugar sa layunin niya. Yung katapatan ko, mukhang limitado, pero hindi ko alam kung paano ito makakatulong sa mas malaking ginagawa ni Jehova.",tl_add2:"Nandyan din po ang isyu ng soberanya. Kumilos po si Paraon na parang absolute na awtoridad siya sa buhay, pero kinilala po nina Sifra at Pua ang mas mataas na Tagapamahala. Yung conflict pong yun, nagpapauna na sa katotohanang makikita sa buong Bibliya: si Jehova ang mas karapat-dapat sundin kaysa sa anumang human power.",tl_quick:"Po, ang pagkaligtas ni Moises ay nagpapakita na walang pinuno ang makakapigil kay Jehova na isulong ang layunin niya.",tl_q:"Ano ang koneksiyon ng ulat na ito sa layunin ni Jehova?"},{n:"10",q:"What would I like to ask the characters in this Bible account when they are resurrected?",en_main:"I would like to ask Jochebed what she felt when she left basket among reeds and how she managed fear as she walked away. I would ask Miriam what went through her mind before approaching Pharaoh’s daughter, and Shiphrah and Puah how they reacted when they received that terrible order. Their answers could reveal emotions account does not record and show even more clearly that Bible courage existed alongside very real human feelings.",en_add1:"I would also ask Amram how he supported Jochebed during those dangerous months. Bible says little about their conversations as married couple. Learning how they prayed, made decisions, and encouraged each other could offer very practical lessons on how couple can stay united under pressure.",en_add2:"I would ask Miriam what it was like years later to see that baby become man Jehovah used to lead Israel out of Egypt. It must have been amazing to connect her small act of watchfulness by river with everything that happened afterward.",en_quick:"I would love to hear how they experienced moments the Bible summarizes briefly and what they learned about Jehovah.",tl_main:"Gusto ko pong itanong kay Jokebed kung ano po ang naramdaman niya nang iwan niya po ang basket sa talahiban at kung paano niya po na-manage ang takot habang naglalakad palayo. Itatanong ko kay Miriam kung ano ang tumakbo sa isip niya bago lapitan ang anak na babae ni Paraon, at kina Sifra at Pua kung paano sila nag-react nang matanggap yung kakilakilabot na utos. Yung mga sagot nila, puwedeng magpakita ng emosyon na hindi na-record ng salaysay at mas lalo pa pong ipakita na ang tapang sa Bibliya ay kasama ang totoong damdamin ng tao.",tl_add1:"Itatanong ko rin po kay Amram kung paano niya po sinuportahan si Jokebed sa mga mapanganib na buwan na yun. Kaunti lang po ang sinasabi ng Bibliya tungkol sa pag-uusap nila bilang mag-asawa. Kapag nalaman ko kung paano sila nanalangin, nagdesisyon, at nagpalakasan ng loob, magbibigay ito ng napaka-praktikal na aral kung paano manatiling nagkakaisa ang mag-asawa sa ilalim ng pressure.",tl_add2:"Itatanong ko po kay Miriam kung ano po ang pakiramdam makalipas ang ilang taon nang makita niya na yung sanggol na yun ay naging lalaki na ginamit po ni Jehova para ilabas ang Israel sa Ehipto. Siguradong amazing na mai-connect yung maliit niyang pagbabantay sa ilog sa lahat ng nangyari pagkatapos.",tl_quick:"Po, gusto ko pong marinig kung paano nila naranasan yung mga sandaling maikli lang na sinummarize ng Bibliya at kung ano ang natutuhan nila tungkol kay Jehova.",tl_q:"Ano ang matatanong mo kina Sifra, Pua, Amram, Jochebed, at Miriam kapag binuhay na silang muli?"}],gems:[{q:'Jer 36:30—How did the prophecy that Jehoiakim would have no successor come true? (it "Jehoiakim" ¶9)',tl_q:'Jer 36:30—Inihula sa tekstong ito na walang sinuman sa angkan ni Jehoiakim ang uupo sa trono ni David. Paano ito natupad? (it "Jehoiakim" ¶9)',a:`The prophecy in Jer 36:30 said Jehoiakim would have no one to continue sitting on David's throne. It came true exactly: His son Jehoiachin reigned only 3 months and 10 days (2 Chron 36:9) before Nebuchadnezzar took him captive to Babylon. After that, no descendant of Jehoiakim ever ruled as king on David's throne in Judah — the kingship ended with him. Jehovah's word never fails.

This shows Jehovah's prophecies are precise and reliable. If He fulfilled this judgment, we can trust He will fulfill His promises about the Kingdom.`,tl_a:`Natupad nang eksakto ang hula sa Jer 36:30. Ang anak ni Jehoiakim na si Jehoiakin ay naghari lang nang 3 buwan at 10 araw (2 Cro 36:9) bago binihag ni Nabucodonosor. Pagkatapos noon, wala nang sinuman sa angkan ni Jehoiakim ang umupo ulit sa trono ni David sa Juda — natapos na ang paghahari nila.

Pinatutunayan nito na tumpak at maaasahan ang mga hula ni Jehova. Kung tinupad Niya ang hatol na ito, tiyak na tutuparin din Niya ang mga pangako tungkol sa Kaharian.`,c:"Reference: it book 'Jehoiakim' par.9 — Jehoiachin's brief reign did not count as a continuing dynasty. This strengthens faith in prophecy.",tl_c:"Sanggunian: it aklat 'Jehoiakim' par.9 — ang maikling paghahari ni Jehoiakin ay hindi maituturing na pagpapatuloy ng dinastiya. Pinatitibay nito ang pananampalataya sa hula.",s:"Jehoiachin reigned only 3 months 10 days; no descendant of Jehoiakim continued on David's throne.",tl_s:"3 buwan 10 araw lang naghari si Jehoiakin; walang angkan ni Jehoiakim ang nagpatuloy sa trono ni David."},{q:"What spiritual gems from this week's Bible reading would you like to share?",tl_q:"Sa pagbabasa ng Bibliya para sa linggong ito, anong espirituwal na hiyas ang nagustuhan mo?",a:`Jer 36:5,6 — Jeremiah was under ban, unable to enter Jehovah's house, but he used Baruch to read publicly.
Gem: Even with limitations, Jehovah makes a way if we are resourceful.
Application today: If we have health issues, are elderly, or can't go to the Kingdom Hall regularly, we can still have a share in the ministry — letter writing, phone witnessing, supporting congregation arrangements like Baruch did.

Jer 36:9,10 — Baruch read in the chamber of Gemariah in the upper courtyard.
Gem: Use public places and opportunities to share God's Word boldly.
Application: We can use public places today — bus stops, workplaces, school, informal witnessing in markets — as our 'upper courtyard' to start conversations.

Jer 36:23 — Jehoiakim cut the scroll with a scribe's knife and burned it.
Gem: People may try to destroy or censor the Bible, but they cannot stop Jehovah's purpose.
Application: When people reject or even mock our Bible message today, we don't give up. Like Jeremiah, we keep writing and speaking — God's Word endures.

Jer 36:27,28,32 — After burning, Jehovah told Jeremiah to write it again and add more.
Gem: Opposition only makes God's Word spread more.
Application: If a householder is not interested, we can try again later with a different approach; Jehovah may add more to our understanding and we can return.

Jer 37:5 — Pharaoh's army came and Babylonians retreated temporarily.
Gem: Don't be fooled by temporary relief.
Application: Satan may give temporary relief from problems to make us relax. We must stay alert and not think the end of trials means Jehovah's judgment won't come.

Jer 37:7 — Jehovah said Egypt will return and Babylon will return.
Gem: Jehovah knows the future in detail.
Application: We can fully trust Bible prophecy about the last days. If Jehovah predicted Babylon's return accurately, His promises about the Kingdom will also come true.

Jer 37:12 — Jeremiah tried to go to Benjamin's territory for personal affairs.
Gem: Even prophets have personal matters, but service comes first.
Application: We also have personal matters — family, work, errands — but we prioritize Kingdom interests first, like Jesus said at Matt 6:33.

Jer 37:15-21 — Jeremiah was beaten and jailed falsely, but Jehovah moved Zedekiah to give him bread daily and better quarters.
Gem: When faithful under persecution, Jehovah supports us in unexpected ways.
Application: If we face opposition at work, school, or family, Jehovah may move someone unexpected — a teacher, coworker, or relative — to help us. He doesn't abandon us.

Jer 36:10 — Gemariah son of Shaphan supported Jeremiah; Shaphan helped Josiah.
Gem: Good parents influence children to support pure worship.
Application: As parents today, our example in supporting congregation arrangements teaches our children to support theocratic activities too.

Jer 37:20 — Jeremiah pleaded not to be returned to Jonathan's house to die.
Gem: It's not wrong to make reasonable requests for welfare while serving Jehovah.
Application: We can respectfully speak up about our needs — health, work schedule for meetings — while remaining submissive, just as Jeremiah did.`,tl_a:`Jer 36:5,6 — Hindi makapasok si Jeremias sa bahay ni Jehova pero ginamit niya si Baruc para basahin nang malakas.
Hiyas: Kahit may limitasyon, gagawa ng paraan si Jehova kung madiskarte tayo.
Aplikasyon ngayon: Kung may sakit tayo, matanda na, o hindi makapunta palagi sa Kingdom Hall, puwede pa rin tayong makibahagi — letter writing, phone witnessing, pagsuporta sa kaayusan ng kongregasyon gaya ni Baruc.

Jer 36:9,10 — Binasa ni Baruc sa silid ni Gemarias sa itaas na patyo.
Hiyas: Gamitin ang pampublikong lugar para ibahagi ang Salita ng Diyos.
Aplikasyon: Gamitin natin ang mga pampublikong lugar ngayon — sakayan, trabaho, eskuwelahan, impormal na pagpapatotoo sa palengke — bilang 'itaas na patyo' para magsimula ng usapan.

Jer 36:23 — Pinutol ni Jehoiakim ang balumbon at sinunog.
Hiyas: Maaaring subukang sirain ng mga tao ang Bibliya, pero hindi nila mapipigilan ang layunin ni Jehova.
Aplikasyon: Kapag nire-reject o kinukutya ang mensahe natin, hindi tayo susuko. Tulad ni Jeremias, patuloy tayong magsusulat at magsasalita — mananatili ang Salita ni Jehova.

Jer 36:27,28,32 — Pagkasunog, inutusan ulit si Jeremias na isulat at dagdagan pa.
Hiyas: Ang pagtutol ay lalo lang nagpapalaganap ng Salita ng Diyos.
Aplikasyon: Kung di interesado ang may-bahay, puwede tayong bumalik mamaya na may ibang approach; baka dagdagan pa ni Jehova ang unawa natin.

Jer 37:5 — Dumating ang hukbo ni Paraon at pansamantalang umatras ang Babilonya.
Hiyas: Huwag padaya sa pansamantalang ginhawa.
Aplikasyon: Maaaring magbigay si Satanas ng pansamantalang ginhawa para magpabaya tayo. Manatili tayong alerto.

Jer 37:7 — Sinabi ni Jehova na babalik ang Egipto at babalik ang Babilonya.
Hiyas: Alam ni Jehova ang hinaharap nang detalyado.
Aplikasyon: Lubusan nating mapagkakatiwalaan ang hula ng Bibliya tungkol sa mga huling araw.

Jer 37:12 — Sinubukan ni Jeremias pumunta sa teritoryo ni Benjamin.
Hiyas: Kahit propeta may personal na gawain, pero unahin ang paglilingkod.
Aplikasyon: May personal din tayong gawain — pamilya, trabaho — pero unahin natin ang Kaharian, tulad ng Mat 6:33.

Jer 37:15-21 — Binugbog at ibinilanggo si Jeremias, pero ginamit ni Jehova si Zedekias para bigyan siya ng tinapay araw-araw.
Hiyas: Kapag tapat sa pag-uusig, susuportahan tayo sa di-inaasahang paraan.
Aplikasyon: Kung inuusig tayo sa trabaho o pamilya, maaaring kumilos si Jehova sa di-inaasahang tao — guro, katrabaho — para tulungan tayo.

Jer 36:10 — Si Gemarias na anak ni Sapan ay sumuporta kay Jeremias.
Hiyas: Ang mabuting magulang ay nakakaimpluwensiya sa anak na sumuporta sa dalisay na pagsamba.
Aplikasyon: Bilang magulang, ang halimbawa natin sa pagsuporta sa kongregasyon ay nagtuturo sa mga anak na sumuporta rin.

Jer 37:20 — Nakiusap si Jeremias na huwag ibalik sa bahay ni Jonatan para mamatay.
Hiyas: Hindi mali ang gumawa ng makatuwirang pakiusap.
Aplikasyon: Puwede tayong magsalita nang magalang tungkol sa pangangailangan natin — kalusugan, iskedyul — habang nananatiling masunurin.`,c:"10 gems for 2 chapters — shows resourcefulness, boldness, endurance of God's Word, trust in prophecy, and Jehovah's support in trials.",tl_c:"10 hiyas para sa 2 kabanata — nagpapakita ng pagiging madiskarte, katapangan, pananatili ng Salita ng Diyos, pagtitiwala sa hula, at suporta ni Jehova sa pagsubok.",s:"Resourceful like Jeremiah, God's Word cannot be burned, trust prophecy, Jehovah provides bread even in prison.",tl_s:"Maging madiskarte gaya ni Jeremias, hindi masusunog ang Salita ng Diyos, magtiwala sa hula, naglalaan si Jehova ng tinapay kahit sa bilangguan."}],tl_wtTitle:"Patuloy na Kilalanin si Jehova",tl_congTitle:"Sifra, Pua, Amram, Jokebed, at Miriam — Sa Pananampalataya Itinago si Moises",tl_label:"Setyembre 21-27, 2026 - Jeremias 36-37",tl_theme:'"Kilalanin mo ang Diyos ng iyong ama at maglingkod ka sa kaniya nang buong puso." — 1 Cro. 28:9',theme:'"Know the God of your father and serve him with a complete heart." — 1 Chron. 28:9',gemsTitle:"Jehovah Helps Those Who Support His Kingdom",tl_gemsTitle:"Tinutulungan ni Jehova ang mga Sumusuporta sa Kaharian Niya",gemsReading:"Jeremiah 36-37",tl_gemsReading:"Jeremias 36-37",wtTheme:'"Know the God of your father and serve him with a complete heart." — 1 Chron. 28:9',tl_wtTheme:'"Kilalanin mo ang Diyos ng iyong ama at paglingkuran mo siya nang buong puso." — 1 Cro. 28:9'},"2026-09-28":{label:"Sept 28 - Oct 4, 2026 - Jeremiah 38-39",wtTitle:"Help Others Come to Know Jehovah",congTitle:"He Made His Choice - Moses",wt:[{n:"1",q:"How do you feel when you see your Bible student making spiritual progress?",tl_q:"Ano ang nararamdaman mo kapag nakikita mong sumusulong ang bina-Bible study mo?",en_main:"The paragraph says when we see our Bible student come to the meeting for the first time, comment, start preaching, or get baptized, we feel very happy. 1 Cor. 3:5-9 and 3 John 3,4 show spiritual growth is from Jehovah, so we give Him the praise.",tl_main:"Sinasabi sa parapo na kapag nakita mong dumalo sa unang pagkakataon ang bina-Bible study mo sa pulong, nagkomento, nangaral, o nagpabautismo, napakasaya natin. Ipinapakita ng 1 Cor. 3:5-9 at 3 Juan 3,4 na si Jehova ang nagpapalago sa espirituwal, kaya sa Kaniya natin ibinibigay ang papuri.",en_add1:"It teaches us that joy in the ministry is natural and right, but it should lead us to praise Jehovah, not ourselves. Our role is planting and watering, but Jehovah makes it grow.",tl_add1:"Itinuturo nito na natural at tama na magalak sa ministeryo, pero dapat humantong ito sa pagpuri kay Jehova, hindi sa sarili. Tungkulin natin ang magtanim at magdilig, pero si Jehova ang nagpapalago.",en_add2:"I will imitate humble joy: when my student progresses, I will thank Jehovah in prayer and remind the student that Jehovah is his real Teacher, not me.",tl_add2:"Tutularan ko ang mapagpakumbabang kagalakan: kapag sumusulong ang estudyante ko, magpapasalamat ako kay Jehova sa panalangin at ipapaalala sa estudyante na si Jehova ang tunay niyang Guro, hindi ako.",en_quick:"Happy when student progresses, but give praise to Jehovah.",tl_quick:"Masaya kapag sumusulong ang study, pero kay Jehova ang papuri."},{n:"2",q:"What is Jehovah's will for Bible students? (1 Tim. 2:3,4)",tl_q:"Ano ang kalooban ni Jehova para sa mga inaaralan sa Bibliya?",en_main:"The paragraph cites 1 Timothy 2:3,4 that it is Jehovah's will for all sorts of people to be saved and come to accurate knowledge. For that to happen, they need to know Jehovah well, not just facts.",tl_main:"Binanggit sa parapo ang 1 Timoteo 2:3,4 na kalooban ng Diyos na maligtas ang lahat ng uri ng tao at magkaroon ng tumpak na kaalaman. Para mangyari iyan, kailangan nilang makilalang mabuti si Jehova, hindi lang impormasyon.",en_add1:"It teaches that Jehovah wants not just baptism but deep knowledge. The Greek word for accurate knowledge implies full, personal knowledge, not superficial.",tl_add1:"Itinuturo nito na gusto ni Jehova hindi lang bautismo kundi malalim na kaalaman. Ang salitang isinaling tumpak na kaalaman sa orihinal ay nangangahulugang lubos at personal na kaalaman, hindi mababaw.",en_add2:"I will not rush my student to baptism only; I will help him really know Jehovah as a Person, so his dedication lasts.",tl_add2:"Hindi ko lang mamadaliin ang estudyante sa bautismo; tutulungan ko siyang talagang makilala si Jehova bilang Persona, para tumagal ang dedikasyon niya.",en_quick:"Jehovah wants all to come to accurate knowledge of Him.",tl_quick:"Kalooban ni Jehova na magkaroon ng tumpak na kaalaman ang lahat."},{n:"3",q:"What will we discuss in this article?",tl_q:"Ano ang tatalakayin natin sa artikulong ito?",en_main:"The paragraph says we will discuss why our Bible students need to know Jehovah well, how we can help them do that, and how we can help them use what they learn about Jehovah.",tl_main:"Sinasabi sa parapo na tatalakayin natin kung bakit kailangang makilalang mabuti ng mga inaaralan natin si Jehova, paano natin sila matutulungan na magawa iyan, at paano natin sila matutulungang gamitin ang natutuhan nila tungkol kay Jehova.",en_add1:"It teaches that teaching is three-step: need, how to know, how to apply. This gives us clear direction.",tl_add1:"Itinuturo nito na ang pagtuturo ay may tatlong hakbang: bakit kailangan, paano makilala, paano gamitin. Malinaw ang direksiyon nito.",en_add2:"I will follow this outline in my studies: first show why knowing Jehovah matters, then show His qualities, then help student apply.",tl_add2:"Susundin ko ang balangkas na ito sa pag-aaral: una ipakita kung bakit mahalaga ang pagkilala kay Jehova, tapos ipakita ang katangian Niya, tapos tulungang gamitin.",en_quick:"Why students need to know Jehovah, how to help them know, and how to use it.",tl_quick:"Bakit kailangan makilala si Jehova, paano matutulungan, at paano gamitin."},{n:"4",q:"In harmony with Mark 12:30, what should be our main goal when teaching the Bible?",tl_q:"Kaayon ng Marcos 12:30, ano ang pangunahing layunin natin kapag nagtuturo ng Bibliya?",en_main:"The paragraph says based on Mark 12:30, our main goal is to help students love Jehovah with whole heart, soul, mind, and strength. If they love Him, they will obey. John 14:31 and 1 John 5:3 show love moves obedience.",tl_main:"Sinasabi sa parapo na ayon sa Marcos 12:30, ang pangunahing layunin natin ay tulungang ibigin ng estudyante si Jehova nang buong puso, kaluluwa, pag-iisip, at lakas. Kung mahal niya si Jehova, susundin niya Siya. Ipinapakita ng Juan 14:31 at 1 Juan 5:3 na ang pag-ibig ang nag-uudyok sa pagsunod.",en_add1:"It teaches that love is the best motivation, not fear or guilt. A student who loves Jehovah will remain close even when hard.",tl_add1:"Itinuturo nito na ang pag-ibig ang pinakamabisang motibasyon, hindi takot o guilt. Ang estudyanteng nagmamahal kay Jehova ay mananatiling malapit kahit mahirap.",en_add2:"I will not just teach rules; I will share how Jehovah shows love to me, to help my student love Him from the heart.",tl_add2:"Hindi lang ako magtuturo ng tuntunin; ibabahagi ko kung paano ipinakita ni Jehova ang pag-ibig sa akin, para matutong umibig ang estudyante mula sa puso.",en_quick:"Goal is to help student love Jehovah with whole heart - Mark 12:30.",tl_quick:"Layunin na tulungang ibigin si Jehova nang buong puso - Mar. 12:30."},{n:"5",q:"If your Bible student loves Jehovah, what will he be moved to do?",tl_q:"Kung mahal ng bina-Bible study mo si Jehova, mapapakilos siyang gawin ang ano?",en_main:"The paragraph says if a student loves Jehovah, he will be moved to do what pleases Him and avoid what displeases Him, even when no one sees.",tl_main:"Sinasabi sa parapo na kung mahal ng bina-Bible study mo si Jehova, mapapakilos siyang gawin ang nakalulugod sa Kaniya at iwasan ang hindi nakalulugod, kahit walang nakakakita.",en_add1:"It teaches that love makes obedience joyful, not burdensome. Love for Jehovah is stronger than peer pressure.",tl_add1:"Itinuturo nito na ang pag-ibig ang gumagawa sa pagsunod na kasiya-siya, hindi pabigat. Mas malakas ang pag-ibig kay Jehova kaysa sa peer pressure.",en_add2:"I will ask my student: 'Because you love Jehovah, what do you want to do?' rather than just 'What does the Bible say you must do?'",tl_add2:"Tatanungin ko ang estudyante: 'Dahil mahal mo si Jehova, ano ang gusto mong gawin?' sa halip na 'Ano ang sinasabi ng Bibliya na dapat mong gawin?'",en_quick:"Love for Jehovah moves to do what pleases Him.",tl_quick:"Ang pag-ibig kay Jehova ay nag-uudyok na gawin ang nakalulugod sa Kaniya."},{n:"6",q:"How can knowing Jehovah help a student when making decisions?",tl_q:"Kapag kilala ng bina-Bible study mo si Jehova, paano siya nito matutulungan kapag gumagawa ng mga desisyon?",en_main:"The paragraph says knowing Jehovah helps a student ask 'What would Jehovah want me to do?' instead of just 'What do I want?' This guides big and small decisions.",tl_main:"Sinasabi sa parapo na kapag kilala ng bina-Bible study mo si Jehova, matutulungan siya nitong magtanong ng 'Ano ang gusto ni Jehova na gawin ko?' sa halip na 'Ano ang gusto ko?' Gumagabay ito sa malaki at maliliit na desisyon.",en_add1:"It teaches that knowledge of Jehovah becomes a compass. Without it, decisions are based only on self.",tl_add1:"Itinuturo nito na ang kaalaman tungkol kay Jehova ay nagiging kompas. Kung wala ito, ang desisyon ay nakabase lang sa sarili.",en_add2:"I will help my student practice: before a decision, list what you know about Jehovah that relates to it.",tl_add2:"Tuturuan ko ang estudyante na magsanay: bago magdesisyon, ilista kung ano ang alam mo tungkol kay Jehova na may kinalaman dito.",en_quick:"Knowing Jehovah helps ask 'What does Jehovah want?'",tl_quick:"Ang pagkilala kay Jehova ay tumutulong na itanong 'Ano ang gusto ni Jehova?'"},{n:"7",q:"What helped Joseph to make a good decision?",tl_q:"Ano ang nakatulong kay Jose para makagawa ng tamang desisyon?",en_main:"The paragraph on Genesis 39 says Joseph knew Jehovah hates immorality and loves loyalty. He remembered Jehovah's standards from Genesis 2:24 and 20:3, so when Potiphar's wife tempted him, he said it would be a sin against God and ran away.",tl_main:"Sinasabi sa parapo tungkol sa Genesis 39 na alam ni Jose na galit si Jehova sa imoralidad at mahal Niya ang katapatan. Naalala niya ang pamantayan ni Jehova mula sa Genesis 2:24 at 20:3, kaya nang tuksohin siya ng asawa ni Potipar, sinabi niyang kasalanan ito laban sa Diyos at tumakbo siya palayo.",en_add1:"It teaches that knowing what Jehovah loves and hates gives courage to say no, even when costly.",tl_add1:"Itinuturo nito na ang pag-alam kung ano ang mahal at galit ni Jehova ay nagbibigay ng lakas para tumanggi, kahit may kabayaran.",en_add2:"Like Joseph, I will teach my student to see temptation as against Jehovah, not just a rule, and to act quickly like Joseph did.",tl_add2:"Tulad ni Jose, tuturuan ko ang estudyante na tingnan ang tukso bilang laban kay Jehova, hindi lang tuntunin, at kumilos agad tulad ni Jose.",en_quick:"Joseph knew Jehovah hates immorality, so he ran away - Gen. 39.",tl_quick:"Alam ni Jose na galit si Jehova sa imoralidad, kaya tumakbo siya - Gen. 39."},{n:"8",q:"How can you use the Enjoy Life Forever! book to help your student get to know Jehovah well?",tl_q:"Paano mo magagamit ang aklat na Masayang Buhay Magpakailanman para makilalang mabuti ng bina-Bible study mo si Jehova?",en_main:"The paragraph says the Enjoy Life Forever! book has specific questions to help students gradually learn what Jehovah is like, such as 'How does Jehovah feel when teachers of good news preach?' (lesson 21), 'How can you be sure Jehovah's judgments are fair?' (33), 'How does Jehovah feel when you become wise?' (34), and lessons 42,56,57 about marriage, forgiveness, and how He deals with sinners.",tl_main:"Sinasabi sa parapo na ang aklat na Masayang Buhay Magpakailanman ay may mga tanong na espesipikong ginawa para unti-unting maturuan ang bina-Bible study tungkol kay Jehova, tulad ng 'Ano ang nararamdaman ni Jehova sa mga nangangaral ng mabuting balita?' (aralin 21), 'Paano ka makakasiguro na magiging patas at makatarungan ang gagawin nila [sa Armagedon]?' (aralin 33), 'Ano ang nararamdaman ni Jehova kapag nagiging marunong ka?' (aralin 34), at aralin 42,56,57 tungkol sa pag-aasawa, pagpapatawad, at pakikitungo sa nagkasala.",en_add1:"It teaches that the book is designed to reveal Jehovah's personality progressively, not just doctrines.",tl_add1:"Itinuturo nito na ang aklat ay idinisenyo para unti-unting ihayag ang personalidad ni Jehova, hindi lang doktrina.",en_add2:"I will use those specific questions in the book each study to highlight Jehovah's feelings, not just skip them.",tl_add2:"Gagamitin ko ang mga partikular na tanong na iyon sa aklat sa bawat pag-aaral para bigyang-diin ang damdamin ni Jehova, hindi lalampasan.",en_quick:"Use Enjoy Life Forever! questions to reveal Jehovah's feelings.",tl_quick:"Gamitin ang mga tanong sa Masayang Buhay para ihayag ang damdamin ni Jehova."},{n:"9-10",q:"(a) What will help Bible students to get the most out of their Bible reading? (James 5:11) (b) Illustrate how a Bible account can reveal what pleases or what displeases Jehovah.",tl_q:"(a) Ano ang makakatulong sa bina-Bible study mo para mas makinabang siya sa pagbabasa niya ng Bibliya? (Santiago 5:11) (b) Magbigay ng halimbawa kung paano magagamit ang isang ulat sa Bibliya para malaman kung ano ang mga gusto at ayaw ni Jehova.",en_main:"Par. 9 says we encourage students to have a Bible reading routine and to ask why Jehovah included a passage and what qualities it reveals. James 5:11 shows James saw in Job not only endurance but Jehovah's tenderness and mercy. Par. 10 says we want students to discern what pleases/displeases Jehovah. Example: student reads Daniel in lions' den—ask 'Why did Jehovah save Daniel? What does this tell me about what makes Jehovah happy?' (Dan. 6:10,22) and 'What happened to accusers? What does this tell me about what displeases Jehovah?' (Dan. 6:4,5,24) and other qualities—Dan. 6:26,27.",tl_main:"Sinasabi sa parapo 9 na pinapayuhan natin ang estudyante na magkaroon ng regular na pagbabasa at magtanong kung bakit isinama iyon ni Jehova at kung anong katangian Niya ang makikita. Ipinakita ng Santiago 5:11 na sa Job, hindi lang pagtitiis ang nakita ni Santiago kundi ang pagkamapagmahal at maawain ni Jehova. Sa parapo 10, gusto nating matutuhan kung ano ang gusto at ayaw ni Jehova. Halimbawa, kung binasa ang Daniel sa yungib—itanong: 'Bakit iniligtas ni Jehova si Daniel? Ano ang itinuturo tungkol sa nagpapasaya kay Jehova?' (Dan. 6:10,22) at 'Ano nangyari sa nag-akusa? Ano ang itinuturo tungkol sa ayaw ni Jehova?' (Dan. 6:4,5,24) at iba pang katangian—Dan. 6:26,27.",en_add1:"It teaches that Bible reading should reveal Jehovah's personality. Every account can show both what pleases and displeases Him.",tl_add1:"Itinuturo nito na ang pagbabasa ay dapat maghayag ng personalidad ni Jehova. Bawat ulat ay nagpapakita ng gusto at ayaw Niya.",en_add2:"I will help my student ask two questions each reading: What pleases Jehovah here? What displeases Him? Using Daniel as model.",tl_add2:"Tutularan ko sa pagtulong sa estudyante na magtanong ng dalawa sa bawat basa: Ano ang nakalulugod kay Jehova dito? Ano ang hindi Niya gusto? Gamit ang Daniel.",en_quick:"James saw Jehovah's mercy in Job; Daniel account shows what pleases/displeases Jehovah.",tl_quick:"Nakita ni Santiago ang awa ni Jehova kay Job; ang ulat ni Daniel ay nagpapakita ng gusto at ayaw Niya."},{n:"11",q:"How can we help our student to see his Bible study as a gift from Jehovah?",tl_q:"Paano mo matutulungan ang bina-Bible study mo na makitang regalo mula kay Jehova ang pag-aaral niya ng Bibliya?",en_main:"Par. 11 says when a student improves, he may thank us or praise our teaching. Sincere gratitude is not wrong, but we should redirect praise to Jehovah, the Grand Instructor—Isa. 30:20,21. The Source of benefits is Jehovah, not us.",tl_main:"Sinasabi sa parapo 11 na kapag napapabuti ang bina-Bible study, baka pasalamatan ka niya o purihin ang paraan mo ng pagtuturo. Hindi masama ang taos-pusong pasasalamat, pero dapat nating i-redirect ang papuri kay Jehova, ang Dakilang Tagapagturo—Isa. 30:20,21. Si Jehova ang Pinagmumulan ng benepisyo, hindi tayo.",en_add1:"It teaches humility for teachers and helps students see Jehovah as their real Teacher, strengthening their bond with Him.",tl_add1:"Itinuturo nito ang kapakumbabaan sa nagtuturo at tinutulungan ang estudyante na makita si Jehova bilang tunay na Guro, na nagpapatibay sa kaugnayan niya kay Jehova.",en_add2:"When my student thanks me, I will say, 'I'm happy to help, but Jehovah is the One teaching you,' and point to Isa. 30:20,21.",tl_add2:"Kapag nagpasalamat ang estudyante ko, sasabihin kong, 'Masaya akong tumulong, pero si Jehova ang nagtuturo sa iyo,' at ituturo ang Isa. 30:20,21.",en_quick:"Redirect praise to Jehovah, the Grand Instructor - Isa. 30:20,21.",tl_quick:"I-redirect ang papuri kay Jehova, ang Dakilang Tagapagturo - Isa. 30:20,21."},{n:"12-13",q:"How can getting to know Jehovah help a student when he finds a Bible account difficult to understand? (See also picture.)",tl_q:"Kung kilala ng bina-Bible study mo si Jehova, paano ito makakatulong kapag nahihirapan siyang maintindihan ang isang ulat sa Bibliya?",en_main:"Par. 12 says to benefit fully, we must use what we know. So when a student finds a divine judgment account difficult—why Jehovah executed some but spared others—teach him to recall what he knows about Jehovah. Par. 13 says encourage reflection: How precious is life to Jehovah? (2 Pet. 3:9) How far has He gone to save sinners? (Eph. 2:4,5) Does Jehovah punish undeserving? Does He let deserving escape? (Ex. 34:6,7) Sometimes Bible doesn't give details to make decision more understandable, but we don't need them. We know our God always does what is right.",tl_main:"Sinasabi sa parapo 12 na para makinabang nang lubos, kailangan nating gamitin ang alam natin. Kaya kapag nahihirapan ang estudyante sa ulat ng hatol—bakit pinuksa ni Jehova ang ilan pero ang iba ay hindi—turuan siyang alalahanin ang alam niya tungkol kay Jehova. Sa parapo 13, hikayatin siyang magbulay: Gaano kahalaga kay Jehova ang buhay? (2 Ped. 3:9) Gaano kalayo ang ginawa Niya para iligtas tayo kahit makasalanan? (Efe. 2:4,5) Pinaparusahan ba ni Jehova ang hindi dapat? Hinahayaan ba Niyang makatakas ang dapat parusahan? (Ex. 34:6,7) Kung minsan, hindi ibinibigay sa Bibliya ang detalye para mas maintindihan ang desisyon, pero hindi natin kailangan iyon. Kilala natin ang Diyos natin at kumbinsido tayong lagi Siyang gumagawa ng tama.",en_add1:"It teaches that trusting what we already know about Jehovah helps when we lack details. Faith fills gaps, not doubt.",tl_add1:"Itinuturo nito na ang pagtitiwala sa alam na natin tungkol kay Jehova ay nakakatulong kapag kulang ang detalye. Pananampalataya ang pumupuno sa puwang, hindi pagdududa.",en_add2:"I will help my student recall 2 Pet. 3:9 and Ex. 34:6,7 when he struggles with judgment accounts, and remind him Jehovah always does what is right.",tl_add2:"Tuturuan ko ang estudyante na alalahanin ang 2 Ped. 3:9 at Ex. 34:6,7 kapag nahihirapan sa mga ulat ng hatol, at ipaalala na lagi si Jehova gumagawa ng tama.",en_quick:"Recall what you know: Jehovah values life, is merciful, always does right - 2 Pet. 3:9, Ex. 34:6,7.",tl_quick:"Alalahanin ang alam mo: pinahahalagahan ni Jehova ang buhay, maawain, laging gumagawa ng tama - 2 Ped. 3:9, Ex. 34:6,7."},{n:"14",q:"How can you help your student if he has difficulty getting along with someone in the congregation?",tl_q:"Paano mo matutulungan ang bina-Bible study mo kapag nahihirapan siyang makasundo ang isang kapatid sa kongregasyon?",en_main:"The paragraph says knowing Jehovah helps a student value unity. Ask: What does Jehovah feel
